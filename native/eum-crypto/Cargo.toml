[package]
name = "eum-crypto"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "eumcrypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

