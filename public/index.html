<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관급자재 구매요청서 자동작성</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.png" alt=""><div><b>관급자재 구매요청서</b><small>나라장터 검색 → 업체 선택 → 원본 양식 엑셀</small></div></div>
  <div class="proj">
    <label for="projSel">공사</label>
    <select id="projSel"></select>
    <button class="ghost sm" data-a="newProj" title="새 공사 만들기">＋ 새 공사</button>
    <button class="ghost sm" data-a="copyProj" title="지금 공사를 복사해서 새 공사로">복사</button>
    <button class="ghost sm" data-a="delProj" title="이 공사 삭제">삭제</button>
    <span class="sep"></span>
    <button class="ghost sm" data-a="backup" title="모든 공사를 파일로 저장">백업 저장</button>
    <label class="ghost sm filebtn" title="백업 파일 불러오기">불러오기<input type="file" id="restoreInput" accept=".json"></label>
  </div>
  <span id="sync" class="sync busy" title="눌러서 다시 저장">서버 연결 중…</span>
  <button class="primary" data-a="build">📄 엑셀 출력</button>
</header>

<ol class="steps">
  <li><b>1</b> 공사개요 입력</li>
  <li><b>2</b> 품목 추가</li>
  <li><b>3</b> 품목을 누르고 검색(또는 상품주소 붙여넣기) → 업체 [선택]</li>
  <li><b>4</b> 엑셀 출력</li>
</ol>

<main>
  <details class="card" id="overview" open>
    <summary><h2>공사 개요 <small id="ovSummary"></small></h2></summary>
    <div class="grid" id="project"></div>
  </details>

  <div class="work">
    <aside class="card itemsCol">
      <h2>품목 <small id="itemCount"></small></h2>
      <div id="itemList"></div>
      <button class="ghost wide" data-a="addItem">＋ 품목 추가</button>
    </aside>

    <section class="card editor" id="editor"></section>
  </div>
</main>

<div class="busy" id="busy" hidden><div class="spin"></div><span></span></div>
<div class="toast" id="toast" hidden></div>

<script src="jszip.min.js"></script>
<script src="engine.js"></script>
<script src="card.js"></script>
<script src="app.js"></script>
</body>
</html>
