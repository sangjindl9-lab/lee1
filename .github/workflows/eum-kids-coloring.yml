name: 이음 키즈 컬러링 빌드
on:
  push:
    branches: [eum-kids-coloring]
    paths: ['app/**', '*.kts', 'gradle.properties', '.github/workflows/eum-kids-coloring.yml', '.github/emu/**']
  workflow_dispatch:
    inputs:
      langs: { description: "언어별 화면을 찍을 언어 (비우면 전부)", required: false, default: "" }
      l10n_only: { description: "값이 있으면 언어별 화면만 찍고 기능 테스트는 건너뜀", required: false, default: "" }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: 단위 테스트 + 디버그 APK + 릴리스 AAB
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug bundleRelease --no-daemon 2>&1 | tee build.log
      - name: 테스트 결과 요약
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > tests.txt || true
          import glob, xml.etree.ElementTree as ET
          tot=fail=0
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              r=ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  tot+=1
                  bad=[c for c in tc if c.tag in('failure','error')]
                  fail+=bool(bad)
                  print(('FAIL ' if bad else 'PASS ')+tc.get('classname').split('.')[-1]+'.'+tc.get('name'))
                  for b in bad: print('    '+(b.get('message') or '')[:400])
          print(f'TOTAL {tot}, FAILED {fail}')
          PY
          cat tests.txt
      - name: 실패 로그 올리기
        if: failure()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Exception" -A3 build.log | head -300 > errors.txt || true
          gh release delete eum-kids-coloring-buildlog --yes --cleanup-tag || true
          gh release create eum-kids-coloring-buildlog build.log errors.txt tests.txt --target "$GITHUB_SHA" --prerelease --title "이음 키즈 컬러링 빌드 로그" --notes "빌드 실패 로그"
      - name: 결과물 정리
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk eum-kids-coloring.apk
          cp app/build/outputs/bundle/release/app-release.aab eum-kids-coloring-release-unsigned.aab
          cp app/schemas/kr.eumsoft.kidscoloring.data.AppDb/1.json room-schema-v1.json
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: eum-kids-coloring.apk }
      - name: 릴리스에 올리기
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete eum-kids-coloring-buildlog --yes --cleanup-tag || true
          gh release delete eum-kids-coloring-latest --yes --cleanup-tag || true
          gh release create eum-kids-coloring-latest eum-kids-coloring.apk eum-kids-coloring-release-unsigned.aab room-schema-v1.json tests.txt \
            --target "$GITHUB_SHA" --title "이음 키즈 컬러링 (테스트 APK)" \
            --notes "휴대폰·태블릿에서 eum-kids-coloring.apk 를 내려받아 설치하세요. (디버그 APK) AAB 는 서명되지 않은 릴리스 번들입니다."

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: phone34, api: 34, target: google_apis, profile: pixel_6 }
          - { tag: tablet34, api: 34, target: google_apis, profile: "Nexus 10" }
          - { tag: phone26, api: 26, target: default, profile: pixel_2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터 테스트
        uses: reactivecircus/android-emulator-runner@v2
        env:
          L10N_LANGS: ${{ github.event.inputs.langs }}
          L10N_ONLY: ${{ github.event.inputs.l10n_only }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/emu/test.sh ${{ matrix.tag }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "emu-${{ matrix.tag }}", path: emu }

  emu-publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "emu-*", path: emu, merge-multiple: true }
      - name: 결과 올리기
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          ls emu || exit 0
          rm -f emu/ui.xml
          cat emu/report_*.txt > emu/report.txt || true
          gh release delete eum-kids-coloring-test --yes --cleanup-tag || true
          gh release create eum-kids-coloring-test emu/* --target "$GITHUB_SHA" --prerelease --title "이음 키즈 컬러링 에뮬레이터 테스트 결과" --notes "에뮬레이터(실제 기기 아님) 자동 테스트 결과"
