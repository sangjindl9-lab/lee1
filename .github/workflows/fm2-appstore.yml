name: FM2 iOS App Store 정보 갱신
on:
  push:
    branches: [filemanager2]
    paths: ['ios/appstore/**', '.github/scripts/asc_publish.py', '.github/workflows/fm2-appstore.yml']
permissions:
  contents: write
concurrency:
  group: fm2-appstore
  cancel-in-progress: true
jobs:
  appstore:
    runs-on: macos-26
    defaults: { run: { working-directory: ios } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: 준비
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "::warning::App Store Connect 키가 없어 건너뜀"; exit 0; fi
          brew install xcodegen && xcodegen generate
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 ../.github/scripts/asc_publish.py appstore/metadata.json /tmp account-only
      - name: 앱스토어 스크린샷 촬영 (6.9인치 아이폰)
        run: |
          xcodebuild -project FileManager2.xcodeproj -scheme FileManager2 -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || (tail -30 build.log; exit 1)
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']]
          print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEV" build/sim/Build/Products/Debug-iphonesimulator/FileManager2.app
          mkdir -p shots
          ARGS=(-demoSeed 1 -demoEmail "$DEMO_EMAIL" -demoPassword "$DEMO_PASSWORD")
          xcrun simctl launch "$DEV" kr.eumsoft.filemanager2 "${ARGS[@]}" -startTab 0; sleep 10
          xcrun simctl terminate "$DEV" kr.eumsoft.filemanager2 || true
          n=1
          for t in 0 1 2 3; do
            xcrun simctl launch "$DEV" kr.eumsoft.filemanager2 "${ARGS[@]}" -startTab $t; sleep 8
            xcrun simctl io "$DEV" screenshot "shots/0${n}_tab$t.png"; n=$((n+1))
            xcrun simctl terminate "$DEV" kr.eumsoft.filemanager2 || true
          done
          python3 -c "import struct,glob;[print(f, struct.unpack('>II', open(f,'rb').read(24)[16:24])) for f in sorted(glob.glob('shots/*.png'))]"
      - name: 앱스토어 정보 채우기 (설명·키워드·연령 등급·가격·판매 국가·빌드·심사 정보·스크린샷)
        run: python3 ../.github/scripts/asc_publish.py appstore/metadata.json shots
      - name: 스크린샷 확인용 브랜치에 올리기
        if: always()
        run: |
          [ -d shots ] || exit 0
          mkdir /tmp/pub && cp shots/*.png /tmp/pub/ && cd /tmp/pub
          git init -q -b filemanager2-appstore-shots && git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -qm "App Store screenshots ${{ github.sha }}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" filemanager2-appstore-shots
