# Render 블루프린트: 저장소를 연결하면 웹서비스와 PostgreSQL 을 함께 만든다.
# 무료 DB 는 기간이 지나면 만료되니, 실제 운영 전에 유료 플랜으로 바꾸세요.
services:
  - type: web
    name: stayon
    runtime: node
    plan: free
    region: singapore
    branch: stayon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: stayon-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: KAKAO_REST_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: stayon-db
    plan: free
    region: singapore
    databaseName: stayon
