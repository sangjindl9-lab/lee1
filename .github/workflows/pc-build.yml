name: FM2 PC (Windows·macOS·Linux) build & release
on:
  push:
    branches: [filemanager2]
    paths: ['pc/**', '!pc/signatures/**', '.github/workflows/pc-build.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fm2-pc-build
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows }
          - { os: macos-latest, plat: macos, target: universal-apple-darwin }
          - { os: ubuntu-22.04, plat: linux }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash, working-directory: pc } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plat == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'pc/src-tauri -> target', key: '${{ matrix.plat }}' }
      - name: Linux 빌드 도구 설치
        if: matrix.plat == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf rpm file
      - run: npm install --no-audit --no-fund
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FM2_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # macOS 코드 서명·공증 (Apple 개발자 계정 등록 후 저장소 Secrets에 넣으면 자동 적용, 없으면 임시 서명)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset $v; fi
          done
          ARGS=()
          if [ -n "${{ matrix.target }}" ]; then ARGS+=(--target "${{ matrix.target }}"); fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build "${ARGS[@]}"
          else echo "::warning::업데이트 서명 키가 없어 자동 업데이트용 서명 없이 빌드합니다 (서버는 서명 없는 업데이트를 내려주지 않음)"
            npx tauri build "${ARGS[@]}" --config '{"bundle":{"createUpdaterArtifacts":false}}'; fi
      - name: macOS 실행 확인 (실제로 켜 보고 화면 찍기)
        if: matrix.plat == 'macos'
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format" || true
          lipo -archs "$APP/Contents/MacOS/"* || true
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleShortVersionString|NSLocalNetwork|NSDownloads|LSMinimumSystemVersion" || true
          open "$APP"; sleep 20
          if ! pgrep -f "FileManager2PC" >/dev/null; then echo "::error::macOS에서 앱이 실행되지 않았습니다"; exit 1; fi
          mkdir -p /tmp/shots && screencapture -x /tmp/shots/macos.png || echo "::warning::화면 찍기 실패"
          pkill -f FileManager2PC || true
          if [ -f /tmp/shots/macos.png ]; then
            cd /tmp/shots && git init -q -b filemanager2-pc-shots && git config user.name github-actions && git config user.email actions@github.com
            git add . && git commit -qm "macOS screenshot ${{ github.sha }}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" filemanager2-pc-shots
          fi
      - name: Collect
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp1() { cp "$1" "out/$2"; [ -f "$1.sig" ] && cp "$1.sig" "out/$2.sig" || true; (cd out && sha256sum "$2" > "$2.sha256"); }
          case "${{ matrix.plat }}" in
            windows)
              cp1 "$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)" "FileManager2PC_${VER}_x64-setup.exe" ;;
            macos)
              B=src-tauri/target/universal-apple-darwin/release/bundle
              cp1 "$(ls $B/dmg/*.dmg | head -1)" "FileManager2PC_${VER}_universal.dmg"
              TGZ=$(ls $B/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
              if [ -z "$TGZ" ]; then
                # 서명 키가 없을 때도 나중에 서명할 수 있도록 업데이트용 압축본을 만들어 둡니다
                (cd $B/macos && tar -czf "FileManager2PC.app.tar.gz" *.app); TGZ=$B/macos/FileManager2PC.app.tar.gz
              fi
              cp1 "$TGZ" "FileManager2PC_${VER}_universal.app.tar.gz" ;;
            linux)
              B=src-tauri/target/release/bundle
              cp1 "$(ls $B/deb/*.deb | head -1)" "FileManager2PC_${VER}_amd64.deb"
              cp1 "$(ls $B/rpm/*.rpm | head -1)" "FileManager2PC_${VER}_x86_64.rpm"
              cp1 "$(ls $B/appimage/*.AppImage | head -1)" "FileManager2PC_${VER}_amd64.AppImage" ;;
          esac
          cat out/*.sha256; ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: 'fm2-pc-${{ matrix.plat }}', path: pc/out/* }

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: 'fm2-pc-*', merge-multiple: true }
      - name: Release (새 버전일 때만 생성, 같은 버전은 덮어쓰지 않음)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=$(node -p "require('./pc/src-tauri/tauri.conf.json').version")
          TAG="fm2-pc-v$VER"
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::warning::$TAG 이미 있음 — 서명 보호를 위해 덮어쓰지 않습니다. 버전을 올려 주세요"
          else
            gh release create "$TAG" out/* --target "${{ github.sha }}" --title "파일 관리자 2 PC $VER" \
              --notes "파일 관리자 2 PC 연결 프로그램 $VER — Windows 10/11 64비트(.exe), macOS 11 이상 Intel·Apple Silicon 공용(.dmg), Linux 64비트(.deb·.rpm·.AppImage). 휴대폰 앱과 같은 계정으로 로그인해 승인된 폴더의 파일을 보고 주고받을 수 있습니다."
          fi
