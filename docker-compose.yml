# 웹 NVR — 현장 서버용 Docker Compose
# 설치: docs/02-설치운영.md 참조. 먼저 scripts/init-secrets.sh 를 실행하세요.
name: web-nvr

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: web-nvr-backend:0.3.0
  restart: unless-stopped
  env_file: .env
  environment:
    NVR_DATABASE_URL: postgresql+psycopg://nvr@db:5432/nvr
    NVR_DATABASE_PASSWORD_FILE: /run/secrets/db_password
    NVR_MASTER_KEY_FILE: /run/secrets/nvr_master_key
    NVR_RECORDINGS_DIR: /recordings
    NVR_EXPORTS_DIR: /exports
    NVR_MEDIAMTX_CONFIG_PATH: /mediamtx-config/mediamtx.yml
    NVR_MEDIAMTX_AUTH_URL: http://api:8000/internal/mediamtx/auth
    NVR_DENY_NETWORKS: 172.31.250.0/24
    NVR_TRUSTED_PROXIES: 172.31.250.10/32
    NVR_DISCOVERY_URL: http://172.31.250.1:8099
  secrets: [db_password, nvr_master_key]
  networks: [nvr]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nvr
      POSTGRES_DB: nvr
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvr -d nvr"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nvr]

  api:
    <<: *backend
    command: ["/app/backend/docker/api-entrypoint.sh"]
    volumes:
      - ${NVR_RECORDINGS_HOST_PATH:-./data/recordings}:/recordings
      - ${NVR_EXPORTS_HOST_PATH:-./data/exports}:/exports
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  recorder:
    <<: *backend
    command: ["python", "-m", "nvr.recorder.main"]
    volumes:
      - ${NVR_RECORDINGS_HOST_PATH:-./data/recordings}:/recordings
    # 종료 시 진행 중인 구간을 닫을 시간
    stop_grace_period: 45s
    depends_on:
      api: { condition: service_healthy }   # 마이그레이션 완료 후 시작

  worker:
    <<: *backend
    command: ["python", "-m", "nvr.worker.main"]
    volumes:
      - ${NVR_RECORDINGS_HOST_PATH:-./data/recordings}:/recordings
      - ${NVR_EXPORTS_HOST_PATH:-./data/exports}:/exports
      - mediamtx-config:/mediamtx-config
      # 여러 현장 통합: 이 서버가 현장(Edge)이면 secrets/central.token 을 두고 .env 에 NVR_CENTRAL_URL 설정
      - ./secrets:/run/nvr-secrets:ro
    stop_grace_period: 30s
    depends_on:
      api: { condition: service_healthy }

  # 지능형 분석(불꽃·연기·안전모·수위·침입·배회 등). CPU 추론이라 녹화가 밀리지 않도록 CPU 사용량을 제한한다.
  # 규칙이 하나도 없으면 영상을 받지 않는다. 쓰지 않으면 이 서비스를 지워도 된다.
  analytics:
    <<: *backend
    command: ["python", "-m", "nvr.analytics.main"]
    volumes:
      - ${NVR_RECORDINGS_HOST_PATH:-./data/recordings}:/recordings
    cpus: ${NVR_ANALYTICS_CPUS:-2}
    stop_grace_period: 20s
    depends_on:
      api: { condition: service_healthy }

  # ONVIF 자동 탐색 보조 서비스: 현장망으로 WS-Discovery 멀티캐스트를 보내기 위해 host 네트워크로 실행.
  # NVR 내부 망 게이트웨이(172.31.250.1)에만 바인딩하고 키로 보호한다. 탐색이 필요 없으면 이 서비스를 지워도 된다.
  discovery:
    image: web-nvr-backend:0.3.0
    restart: unless-stopped
    command: ["python", "-m", "nvr.discovery_service"]
    network_mode: host
    environment:
      NVR_MASTER_KEY_FILE: /run/secrets/nvr_master_key
      NVR_DISCOVERY_BIND: 172.31.250.1:8099
    secrets: [nvr_master_key]
    depends_on:
      api: { condition: service_healthy }

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    restart: unless-stopped
    command: ["/mediamtx-config/mediamtx.yml"]
    volumes:
      - mediamtx-config:/mediamtx-config:ro
    ports:
      - "8189:8189/udp"   # WebRTC 미디어(ICE)
      # UDP 가 막힌 망: .env 의 NVR_WEBRTC_TCP=true 와 함께 아래 주석 해제
      # - "8189:8189/tcp"
    depends_on: [worker]
    networks: [nvr]

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: web-nvr-caddy:0.2.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, mediamtx]
    networks:
      nvr:
        ipv4_address: 172.31.250.10

networks:
  nvr:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24   # 카메라 현장망과 겹치면 변경하고 NVR_DENY_NETWORKS 도 맞추세요

volumes:
  pgdata:
  mediamtx-config:
  caddy-data:
  caddy-config:

secrets:
  db_password:
    file: ./secrets/db_password
  nvr_master_key:
    file: ./secrets/master.key
