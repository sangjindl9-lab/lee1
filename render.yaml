# Render Blueprint. 서비스가 서로 디스크를 공유하지 않으므로 STORAGE_BACKEND=s3(R2 등)가 필요합니다.
databases:
  - name: sf-db
    plan: basic-256mb
services:
  - type: keyvalue
    name: sf-redis
    plan: starter
    ipAllowList: []
  -
    type: web
    name: sf-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/healthz
    envVars:
      - { key: ROLE, value: api }
      - { key: TASK_MODE, value: celery }
      - { key: STORAGE_BACKEND, value: s3 }
      - { key: DATABASE_URL, fromDatabase: { name: sf-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: sf-redis, property: connectionString } }
      - { key: SECRET_KEY, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY, sync: false }
      - { key: S3_SECRET_KEY, sync: false }
  - type: worker
    name: sf-worker
    runtime: docker
    rootDir: backend
    envVars:
      - { key: ROLE, value: worker }
      - { fromGroup: sf-shared }
  - type: worker
    name: sf-render
    runtime: docker
    rootDir: backend
    envVars:
      - { key: ROLE, value: render }
      - { fromGroup: sf-shared }
  - type: worker
    name: sf-beat
    runtime: docker
    rootDir: backend
    envVars:
      - { key: ROLE, value: beat }
      - { fromGroup: sf-shared }
  - type: web
    name: sf-web
    runtime: docker
    rootDir: frontend
    envVars:
      - { key: NEXT_PUBLIC_API_URL, sync: false }
envVarGroups:
  - name: sf-shared   # API 서비스와 같은 값(DATABASE_URL, REDIS_URL, SECRET_KEY, ENCRYPTION_KEY, S3_*, TASK_MODE=celery, STORAGE_BACKEND=s3)을 넣는다
    envVars:
      - { key: TASK_MODE, value: celery }
      - { key: STORAGE_BACKEND, value: s3 }
