<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV 공사 설계</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/shared/catalog.js"></script>
<script src="/shared/calc.js"></script>
<script src="/shared/symbols.js"></script>
<script src="/shared/schematic.js"></script>
<script src="/shared/tables.js"></script>
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm">
    <h1>CCTV 공사 설계 프로그램</h1>
    <input name="username" placeholder="아이디" autocomplete="username" required>
    <input name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="primary" type="submit">로그인</button>
    <div id="loginErr" class="err small"></div>
    <div class="muted small">모바일 현장 확인은 <a href="/m.html">현장 화면</a>을 이용하세요.</div>
  </form>
</div>

<div id="projects" class="hidden">
  <div class="topbar"><span class="title">CCTV 공사 설계</span><span class="sp"></span><span id="meName"></span>
    <button id="btnAdmin" class="hidden">관리자</button><button id="btnLicense">라이선스</button><button id="btnProducts">품목 관리</button><button id="btnPw">비밀번호 변경</button><button id="btnLogout">로그아웃</button></div>
  <div class="wrap">
    <div class="row" style="margin-bottom:10px"><h2 style="font-size:16px">프로젝트</h2><span class="grow"></span>
      <label class="small"><input type="checkbox" id="showSample" checked>샘플 프로젝트 표시</label>
      <button id="btnRestore">백업 복원</button><button id="btnNewProject" class="primary">새 프로젝트</button></div>
    <table class="plist"><thead><tr><th>공사명</th><th>현장주소</th><th>발주처</th><th>시스템</th><th>도면</th><th>CCTV</th><th>내 권한</th><th>수정일</th></tr></thead><tbody id="plistBody"></tbody></table>
  </div>
</div>

<div id="editor" class="hidden">
  <div class="topbar"><button id="btnBack">← 목록</button><span class="title" id="projTitle"></span><span class="badge" id="projSys"></span><span class="badge" id="projRole"></span>
    <span class="sp"></span><span id="presence" class="small"></span><span id="saveState" class="savebox saved">저장됨</span><button id="btnSave">저장 (Ctrl+S)</button></div>
  <div id="banners"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="main">
    <div class="left">
      <div class="sec"><div class="hd">도면 <span class="grow"></span><button id="btnAddSheet" title="도면 업로드">+ 업로드</button></div><div class="bd" style="padding:0"><div class="list" id="sheetList" style="max-height:190px"></div></div></div>
      <div class="sec" style="flex:1;display:flex;flex-direction:column;min-height:0"><div class="hd">장비·심볼 라이브러리</div><div class="list lib" id="library" style="flex:1"></div></div>
      <div class="sec"><div class="hd">레이어 <span class="grow"></span><button id="btnAddLayer" title="레이어 추가">+</button></div><div class="list" id="layerList" style="max-height:200px"></div></div>
    </div>
    <div class="center">
      <div class="canvaswrap" id="canvasWrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="status" id="statusBar"></div>
      <div class="bottom" id="bottom"><div class="tabs" id="tabs"></div><div class="tabbody" id="tabBody"></div></div>
    </div>
    <div class="right" id="props"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
