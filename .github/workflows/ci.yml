name: CI
on:
  push: { branches: ["**"] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sf, POSTGRES_PASSWORD: sf, POSTGRES_DB: sf_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sf" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: pip install -r requirements-dev.txt
      - name: 마이그레이션이 모델과 일치하는지 확인
        env: { DATABASE_URL: "postgresql://sf:sf@localhost:5432/sf_test" }
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: 테스트 (외부 API는 모의, DB·파이프라인·FFmpeg 렌더링은 실제 실행)
        env: { TEST_DATABASE_URL: "postgresql://sf:sf@localhost:5432/sf_test" }
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shorts-factory-api ./backend
      - run: docker build -t shorts-factory-web ./frontend
