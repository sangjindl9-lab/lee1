<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>접수 — 이음사인</title>
<link rel="stylesheet" href="/app.css">
<style>body{background:#f6f5f1}.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}.top{background:#fff;border-bottom:3px solid var(--brand);padding:14px 0;margin-bottom:16px}.top .wrap{padding:0 16px;display:flex;gap:12px;align-items:center}.top img{height:34px}</style>
</head>
<body>
<header class="top"><div class="wrap" id="hd"></div></header>
<main class="wrap" id="m">불러오는 중…</main>
<script src="/ui.js"></script>
<script>
const SLUG = location.pathname.split('/').pop();
const lapi = (p, o = {}) => api(`/${SLUG}${p}`, { ...o, base: '/api/l' });
(async () => {
  let c;
  try { c = await lapi(''); } catch (e) { $('#m').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  if (c.company.color) document.documentElement.style.setProperty('--brand', c.company.color);
  document.title = `${c.title} — ${c.company.name}`;
  $('#hd').innerHTML = `${c.company.logo ? `<img src="${c.company.logo}" alt="">` : ''}<div><div class="small muted">접수 받는 회사</div><b style="font-size:17px">${esc(c.company.name)}</b></div>`;
  if (c.closed) { $('#m').innerHTML = `<div class="card"><h2>${esc(c.title)}</h2><div class="note warn">${esc(c.closed)}</div></div>`; return; }
  $('#m').innerHTML = `<div class="card"><h1>${esc(c.title)}</h1>${c.site ? `<p class="muted">${esc(c.site)}</p>` : ''}<p style="white-space:pre-wrap">${esc(c.intro || '')}</p>
    <div class="note" style="margin:10px 0">이 화면은 접수 창구입니다. 작성한 문서는 본인과 접수 회사 담당자만 볼 수 있습니다. 링크·QR 접속만으로 교육 참석이나 본인확인이 끝나지 않습니다.</div>
    <form id="sf"><label class="f"><span>이름 <i>*</i></span><input class="inp" name="name" required autocomplete="name"></label>
    <label class="f"><span>휴대폰 번호 <i>*</i></span><input class="inp" name="phone" type="tel" required placeholder="010-0000-0000" autocomplete="tel"></label>
    ${c.privacy.map((p, i) => `<label class="chk" style="margin-bottom:8px"><input type="checkbox" data-c="${i}"> ${esc(p.text)}${p.required ? ' <b style="color:var(--bad)">(필수)</b>' : ''}</label>`).join('<br>')}
    <div style="margin-top:12px"><button class="btn primary">${c.auth === 'phone_otp' ? '인증번호 받기' : '작성 시작'}</button></div></form>
    <div id="ob" style="display:none;margin-top:14px"><label class="f"><span>인증번호 6자리</span><input class="inp" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button class="btn primary" id="vf">확인 후 작성</button> <span id="dev" class="small muted"></span></div></div>`;
  let st;
  $('#sf').addEventListener('submit', async (e) => {
    e.preventDefault(); const fd = new FormData(e.target);
    const r = await guard(() => lapi('/start', { method: 'POST', body: { name: fd.get('name'), phone: fd.get('phone'), consents: c.privacy.map((_, i) => $(`[data-c="${i}"]`).checked) } }));
    if (r.token) return location.replace('/s/' + r.token);
    st = r; $('#ob').style.display = ''; if (r.devCode) $('#dev').textContent = `(개발용 표시: ${r.devCode})`; toast(`${r.sentTo}(으)로 인증번호를 보냈습니다`);
  });
  $('#vf').addEventListener('click', async () => { const r = await guard(() => lapi('/verify', { method: 'POST', body: { startId: st.startId, startKey: st.startKey, code: $('#code').value } })); location.replace('/s/' + r.token); });
})();
</script>
</body>
</html>
