services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ket, POSTGRES_PASSWORD: ket, POSTGRES_DB: ket }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
  redis:
    image: redis:7
  web:
    build: .
    env_file: .env
    environment:
      KET_DATABASE_URL: postgresql+psycopg://ket:ket@db:5432/ket
      KET_JOB_BACKEND: celery
      KET_REDIS_URL: redis://redis:6379/0
    volumes: [ "storage:/app/storage" ]
    ports: [ "8000:8000" ]
    depends_on: [ db, redis ]
  worker:
    build: .
    env_file: .env
    environment:
      KET_DATABASE_URL: postgresql+psycopg://ket:ket@db:5432/ket
      KET_JOB_BACKEND: celery
      KET_REDIS_URL: redis://redis:6379/0
    volumes: [ "storage:/app/storage" ]
    command: celery -A app.celery_app.celery worker -l info --workdir backend
    depends_on: [ db, redis ]
  # HTTPS: 운영 시 caddy/nginx 리버스 프록시를 앞단에 두십시오 (예: caddy reverse_proxy web:8000)
volumes: { pgdata: {}, storage: {} }
