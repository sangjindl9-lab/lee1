<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검측서류 작성·관리</title>
<style>
:root{
  --bg:#eef0f3; --panel:#fff; --line:#cfd4dc; --line2:#e5e8ec; --text:#14181f; --muted:#646b76;
  --accent:#1f4fbf; --accent-weak:#e6edfb; --danger:#b42318; --warn:#9a5b00; --warn-bg:#fff6dd; --ok:#0b7a4b;
  --uifont:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --docfont:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--uifont);font-size:14px;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:#1b2a44;color:#fff}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
header .site-pick{display:flex;align-items:center;gap:6px;margin-left:18px;font-size:13px}
header select{background:#fff;color:#111;border-radius:4px;border:0;padding:5px 8px;max-width:420px}
header .sp{flex:1}
#saveState{font-size:12px;opacity:.85}
nav{background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow:auto}
nav a{display:block;padding:10px 18px;color:var(--text);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#f4f6f9}
nav a.on{background:var(--accent-weak);border-left-color:var(--accent);color:var(--accent);font-weight:700}
main{overflow:auto;padding:16px 20px 40px;position:relative}
main.editor-mode{padding:0;overflow:hidden}
#errBar{display:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:50;background:var(--danger);color:#fff;padding:10px 16px;border-radius:6px;max-width:80vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#errBar.on{display:flex;gap:12px;align-items:center}
#errBar button{background:#fff;color:var(--danger);border:0;border-radius:4px;padding:3px 8px;cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b2a44;color:#fff;padding:9px 18px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
h2{font-size:19px;margin:2px 0 14px}
h3{font-size:15px;margin:0 0 10px}
h3 small,h4 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
h4{font-size:13.5px;margin:14px 0 8px;color:#333}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.muted{color:var(--muted);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f3f5f8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1a43a3}
.btn.dan{color:var(--danger);border-color:#e7b4ae}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#3b414b;min-width:0}
.fld>span{font-weight:600}
.fld small{color:var(--muted);font-weight:400}
.fld input,.fld select,.fld textarea, input.in, select.in, textarea.in{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;font-size:13.5px;width:100%;min-width:0}
.fld textarea,textarea.in{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid #9db6ee;outline-offset:-1px;border-color:#7d9be0}
.need input{background:#fff3cd;border-color:#e0a800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
table.lt{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
table.lt th,table.lt td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:middle}
table.lt th{background:#f5f7fa;font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
table.lt tr:hover td{background:#fafbfd}
table.lt td.nw{white-space:nowrap}
table.et{width:100%;border-collapse:collapse;font-size:13px}
table.et th{background:#f5f7fa;padding:6px;border:1px solid var(--line2);font-weight:700;white-space:nowrap}
table.et td{border:1px solid var(--line2);padding:3px;vertical-align:top}
table.et td input,table.et td select,table.et td textarea{width:100%;border:1px solid transparent;border-radius:3px;padding:4px 5px;background:transparent;font-size:13px}
table.et td input:hover,table.et td select:hover,table.et td textarea:hover{border-color:var(--line)}
table.et td textarea{resize:vertical;min-height:34px;line-height:1.35}
table.et td.ops{white-space:nowrap;vertical-align:middle}
table.et td.c{text-align:center;vertical-align:middle}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef1f5;color:#333;white-space:nowrap}
.st-작성중{background:#eef1f5}.st-요청서작성완료{background:#e6edfb;color:#1f4fbf}.st-제출완료{background:#e3f4ff;color:#075985}
.st-검측완료{background:#e3f6ec;color:#0b7a4b}.st-보완필요{background:#fff1e0;color:#9a5b00}.st-재검측{background:#fde8e8;color:#b42318}.st-종결{background:#e9e9ef;color:#444}
.re-tag{color:#c00;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;margin-top:2px}
.banner{background:var(--warn-bg);border:1px solid #f0cf7a;color:#6b4200;border-radius:6px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.banner.info{background:#eef4ff;border-color:#bcd0f5;color:#22407a}
.empty{padding:28px;text-align:center;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700;font-size:15px;margin-bottom:8px}
/* editor */
.ed{display:grid;grid-template-columns:minmax(520px,47%) 1fr;height:calc(100vh - 52px)}
.ed-left{overflow:auto;padding:0 16px 60px;border-right:1px solid var(--line)}
.ed-bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;align-items:center;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.dirty{color:var(--warn);font-size:12.5px;visibility:hidden}.dirty.on{visibility:visible}
.ed-right{display:flex;flex-direction:column;overflow:hidden;background:#d9dde3}
.pv-tabs{display:flex;gap:4px;padding:8px 12px;background:#cfd4db;align-items:center;flex-wrap:wrap}
.pv-tabs button{border:1px solid #aab2bd;background:#eef0f3;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.pv-tabs button.on{background:#1b2a44;color:#fff;border-color:#1b2a44}
.pv-scroll{flex:1;overflow:auto;padding:14px}
.pv-pages .page{margin:0 auto 14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pv-warn{background:#fde8e8;color:#8a1c12;padding:6px 10px;font-size:12.5px;display:none}
.pv-warn.on{display:block}
.noRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 4px;padding:8px 10px;background:#f5f7fa;border-radius:6px}
.noRow b{font-size:15px}
.noRow input:not([type=checkbox]){border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-width:280px}
.snap{margin-top:10px;font-size:12.5px;background:#fafbfc;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;line-height:1.6}
.wk-list{max-height:170px;overflow:auto;border:1px solid var(--line2);border-radius:5px;padding:4px 8px;background:#fcfcfd;margin:6px 0}
.wk-list label{display:flex;gap:8px;padding:3px 0;font-size:13px;cursor:pointer}
.wk-list label.added{color:var(--muted)}
.ovr{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.ovr .h{grid-column:1/-1;font-weight:700;margin-top:6px;color:#333}
.split{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
.list-pick a{display:block;padding:8px 10px;border-radius:5px;cursor:pointer;color:inherit;text-decoration:none;border:1px solid transparent}
.list-pick a.on{background:var(--accent-weak);border-color:#bcd0f5;font-weight:700}
.list-pick a:hover{background:#f3f5f8}
/* 사진 편집 목록 */
.ph-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ph-row{display:grid;grid-template-columns:132px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line2);border-radius:6px;padding:8px;background:#fcfcfd}
.ph-row .thumb{width:132px;height:99px;background:#eef0f3;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;color:var(--muted)}
.ph-row .thumb img{max-width:100%;max-height:100%;display:block}
.ph-row .pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.ph-row .ops{display:flex;flex-direction:column;gap:4px}
.ph-drop{border:2px dashed #9db6ee;background:#f3f7ff;border-radius:6px;padding:14px;text-align:center;color:#22407a;margin-top:8px}
.ph-drop.on{background:#dfe9ff}
#stage{position:absolute;left:-20000px;top:0;visibility:hidden;pointer-events:none}
#printArea{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:70}
.modal{background:#fff;border-radius:8px;padding:18px 20px;min-width:380px;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin-bottom:12px}
.modal .row{justify-content:flex-end;margin-top:16px}

/* ===================== 문서(출력) 서식 ===================== */
.page{width:210mm;height:296.8mm;background:#fff;color:#000;position:relative;overflow:hidden;
  padding:15mm 17mm 12mm 19mm;font-family:var(--docfont);font-size:10.5pt;line-height:1.35;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.page .pbody{height:100%;overflow:hidden}
.page.flow{height:auto;min-height:296.8mm;overflow:visible}
.page.flow .pbody{height:auto;overflow:visible}
.page .remark{position:absolute;top:9mm;right:14mm;color:#d00000;font-weight:700;font-size:16pt}
.page .pno{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font-size:9pt;color:#333}
.page h1{font-size:20pt;font-weight:700;text-align:center;margin:0}
.page .t-req{letter-spacing:.42em;margin:0 0 5mm;text-indent:.42em}
.page .t-res{letter-spacing:.42em;margin:0 0 4mm;text-indent:.42em}
.page .t-cl{margin:8mm 0 10mm;letter-spacing:.05em}
.page .t-ro{font-size:15pt;margin:6mm 0 7mm}
.page .dline{text-align:right;margin:0 6mm 3.5mm 0}
.page .ln{margin:0 0 3mm 2mm;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.page .ln.lead{margin-bottom:3mm}
.page table.doc{width:100%;border-collapse:collapse;table-layout:fixed;border:2px solid #000}
.page table.doc th,.page table.doc td{border:1px solid #000;padding:1.4mm 2mm;text-align:center;vertical-align:middle;font-weight:400;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.page table.doc td.left,.page table.doc th.left{text-align:left}
.page table.t1 tr{height:8.6mm}
.page table.t2 tr{height:8.6mm}
.page .signline{text-align:right;margin:2mm 8mm 0 0;min-height:10mm;display:flex;justify-content:flex-end;align-items:center;gap:8mm}
.page .in{display:inline-block;min-width:11mm;text-align:center}
.page .cut{border-top:2px dashed #000;margin:2mm 0 7mm}
.page .projline{margin:5mm 0 1mm 1mm;white-space:pre-wrap;word-break:keep-all}
.page .sig2{display:grid;grid-template-columns:auto 26mm 12mm;justify-content:end;align-items:center;gap:0 6mm;min-height:11mm;margin-right:8mm}
.page .notes{margin-top:3mm;font-size:9.5pt;line-height:1.6}
.page .notes .red{color:#d00000;font-weight:700}
.page table.info tr{height:10.5mm}
.page table.cl{margin-top:8mm}
.page table.cl thead tr{height:12mm}
.page table.cl tbody tr{height:10.6mm}
.page table.cl td.it{text-align:left;font-size:9.5pt;padding-left:calc(2mm + 1.25em);text-indent:-1.25em}
.page table.cl td.crit{font-size:9.5pt}
.page table.cl td.sym{font-size:13pt;font-weight:700}
.page table.cl td.act{font-size:9pt}
.page table.foot{border-top:3px double #000}
.page table.foot tr{height:10.6mm}
.page table.foot th.small{font-size:8.5pt;letter-spacing:-.5px;padding-left:1mm;padding-right:1mm}
.page table.foot td.sg{text-align:center}
.page .legend{margin-top:2.5mm;font-size:9pt;text-align:right;white-space:pre-wrap}
.page .conthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #000;padding-bottom:2mm;margin:2mm 0 5mm;font-size:10pt}
.page .conthead b{font-size:13pt}
.page .ro-proj{margin:0 0 3mm 4mm;white-space:pre-wrap;word-break:keep-all}
.page table.ro{border:1.5px solid #000;font-size:9.5pt}
.page table.ro thead tr{height:9mm}
.page table.ro tbody tr{height:8.4mm}
.page table.ro th,.page table.ro td{padding:1mm 1mm}
.page table.ro td.sm{font-size:8.5pt}
.page .ro-foot{display:flex;justify-content:space-between;gap:10mm;margin:4mm 6mm 0 1mm}
.page .ro-foot span:first-child{white-space:pre-wrap;word-break:keep-all}
.page .ro-foot span:last-child{white-space:nowrap;margin-right:16mm}
.page .ro-sign{display:flex;justify-content:flex-end;align-items:center;gap:8mm;margin:10mm 22mm 0 0;min-height:12mm}
.page .ro-guide{margin-top:12mm;line-height:1.9}
.page .t-ph{font-size:20pt;letter-spacing:.6em;text-indent:.6em;margin:3mm 0 7mm}
.page .ph-proj{margin:0 0 2mm 1mm;white-space:pre-wrap;word-break:keep-all}
.page .ph-grid{display:grid;gap:4mm}
.page .ph-grid.ph4{grid-template-columns:1fr 1fr}
.page .ph-grid.ph2{grid-template-columns:1fr}
.page .ph-cell{border:2px solid #000;break-inside:avoid}
.page .ph-img{height:99mm;padding:2mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
.page .ph-img img{width:100%;height:100%;display:block}
.page .ph-img .noimg{color:#888;font-size:10pt}
.page table.ph-t{width:100%;border-collapse:collapse;table-layout:fixed;border-top:1px solid #000}
.page table.ph-t th,.page table.ph-t td{border:1px solid #000;border-bottom:0;padding:1mm 1.5mm;text-align:center;font-weight:400;height:8.5mm;word-break:keep-all;overflow-wrap:anywhere}
.page table.ph-t tr:first-child th,.page table.ph-t tr:first-child td{border-top:0}
.page table.ph-t tr th:first-child{border-left:0}.page table.ph-t tr td:last-child{border-right:0}
.page .ph4 table.ph-t{font-size:8.5pt}
.page .ph4 table.ph-t th,.page .ph4 table.ph-t td{padding:.8mm .8mm;height:8mm}

@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  #app,#stage,#errBar,#toast,.modal-bg{display:none!important}
  #printArea{display:block!important}
  #printArea .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  #printArea .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>검측서류 작성·관리</h1>
    <div class="site-pick">현재 현장 <select id="curSite"></select></div>
    <span class="sp"></span>
    <span id="saveState"></span>
    <form id="logoutForm" method="post" action="/logout" style="display:none;margin:0"><button class="btn sm" style="background:transparent;color:#fff;border-color:#5b6b88">로그아웃</button></form>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="errBar"><span id="errMsg"></span><button onclick="hideErr()">닫기</button></div>
<div id="toast"></div>
<div id="stage"></div>
<div id="printArea"></div>
<datalist id="dlResult"><option value="합격"><option value="불합격"><option value="보완 후 재검측"><option value="조건부 합격"></datalist>

<script>
'use strict';
/* ============================================================
   검측서류 작성·관리 프로그램 (단일 파일, 서버 없음)
   저장: 브라우저 localStorage  키 'gcms.data.v1'
   ============================================================ */
const STORE_KEY='gcms.data.v1';
const BACKUP_FORMAT='gcms-backup', BACKUP_VERSION=2, DATA_VERSION=1;
const STATUSES=['작성 중','요청서 작성 완료','제출 완료','검측 완료','보완 필요','재검측','종결'];
const RES_OPTS=[['','미입력'],['ok','적합'],['ng','부적합'],['na','해당 없음']];
const FONTS={malgun:'"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif',
  gulim:'Gulim,"굴림","Malgun Gothic","Noto Sans CJK KR",sans-serif',
  batang:'Batang,"바탕","AppleMyungjo","Noto Serif CJK KR","Noto Serif KR",serif'};

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=x=>x!=null&&String(x).trim()!=='';
const arr=x=>Array.isArray(x)?x:[];
const nowISO=()=>new Date().toISOString();
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseD(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function fK(s,pad){const p=parseD(s);if(!p)return '';const mm=pad?String(p.m).padStart(2,'0'):p.m,dd=pad?String(p.d).padStart(2,'0'):p.d;return `${p.y}년 ${mm}월 ${dd}일`}
const BLANK_DATE='&emsp;&emsp;&ensp;&nbsp;년&emsp;&ensp;&nbsp;월&emsp;&ensp;&nbsp;일';
function fSlash(s){const p=parseD(s);return p?`${p.y}/${p.m}/${p.d}`:''}
function fLocal(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function spaced(n){n=String(n||'').trim();return /^[가-힣]{2,3}$/.test(n)?n.split('').join(' '):n}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let t=o;for(let i=0;i<ks.length-1;i++){if(t[ks[i]]==null)t[ks[i]]={};t=t[ks[i]]}t[ks[ks.length-1]]=v}
function nl(s){return esc(s)}

/* ---------------- 데이터 기본형 ---------------- */
function defaultSettings(){return {currentSiteId:null,symbols:{ok:'O',ng:'X',na:'/'},legendText:'',showLegend:false,reMode:'same',seqDigits:2,docFont:'malgun',lastEditedId:null,photoPerPage:4,photoFit:'contain'}}
function normSite(s){s=s||{};return Object.assign({id:uid(),name:'',contractor:'',prefix:'',field:'전기',fieldCustom:'',recipient:'',siteAgent:'',inspector:'',
  cmTitle:'전기건설사업관리기술인',cmName:'',chiefTitle:'책임건설사업관리기술인',chiefName:'',attachDefault:'',createdAt:nowISO(),updatedAt:nowISO()},s)}
function normWorker(w){w=w||{};return Object.assign({id:uid(),org:'',position:'',name:'',birth:'',active:true,memo:''},w)}

/* ---------------- 사진 저장소 ----------------

async function decodeImage(src){

async function compressImage(file,rot=0){
  const bmp=await decodeImage(file);const w0=bmp.width,h0=bmp.height;const sc=Math.min(1,PHOTO_MAX/Math.max(w0,h0));
  const w=Math.round(w0*sc),h=Math.round(h0*sc);const sw=rot%180?h:w,sh=rot%180?w:h;
  const c=document.createElement('canvas');c.width=sw;c.height=sh;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sw,sh);
  g.translate(sw/2,sh/2);g.rotate(rot*Math.PI/180);g.drawImage(bmp,-w/2,-h/2,w,h);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',PHOTO_Q))}

/* 3-방향 병합: 내가 마지막으로 받은 상태(base) 이후 내가 바꾼 기록만 최신 서버 데이터(theirs)에 반영 */
let baseSnap=null;
function threeWay(base,mine,theirs){const out=clone(theirs);const changed=[];
  for(const k of ['sites','workers','templates','inspections']){
    const B=new Map(arr(base[k]).map(x=>[x.id,JSON.stringify(x)])),M=new Map(arr(mine[k]).map(x=>[x.id,x]));
    for(const id of B.keys())if(!M.has(id))out[k]=out[k].filter(x=>x.id!==id);
    for(const [id,x] of M){if(B.get(id)===JSON.stringify(x))continue;const i=out[k].findIndex(y=>y.id===id);if(i>=0)out[k][i]=clone(x);else out[k].push(clone(x));if(k==='inspections')changed.push(id)}}
  for(const key in mine.counters)out.counters[key]=Math.max(+mine.counters[key]||0,+out.counters[key]||0);
  for(const key in mine.settings)if(LOCAL_KEYS.includes(key)||JSON.stringify(mine.settings[key])!==JSON.stringify((base.settings||{})[key]))out.settings[key]=clone(mine.settings[key]);
  return {out,changed}}
/* 동시에 같은 번호를 쓴 경우 내 쪽 새 기록에 다음 번호를 다시 매김 */
function fixDupNumbers(ids){const msgs=[];
  for(const id of ids){const d=data.inspections.find(x=>x.id===id);if(!d||d.manualNo||d.isRe||!d.numKey||d.numKey.startsWith('re:')||d.numKey==='manual')continue;
    if(dupOf(d,d.docNo)){const old=d.docNo,key=numKeyOf(d),seq=nextSeq(key,d.id);data.counters[key]=seq;d.seq=seq;d.docNo=buildNo(d.site,d.round,seq);
      if(state.draft&&state.draft.id===id){state.draft.docNo=d.docNo;state.draft.seq=seq;state.draft.numKey=key}msgs.push(`${old} → ${d.docNo}`)}}
  return msgs}

function persist(){
  try{if(state.loadFailed)throw new Error('처음에 데이터를 읽지 못해 덮어쓰기를 막았습니다. 프로그램을 다시 실행하세요.');

      /* 다른 사용자(창)가 먼저 저장함 → 최신 데이터에 내 변경만 합쳐서 다시 저장 */
      let msgs=[];
      for(let t=0;t<3;t++){const theirs=fetchTheirs();const m=threeWay(JSON.parse(baseSnap||'{}'),data,theirs);data=normalizeData(m.out);msgs=fixDupNumbers(m.changed);
        try{storeSet(JSON.stringify(data));break}catch(e2){if(!e2.conflict||t===2)throw e2.conflict?new Error('다른 사용자의 저장이 계속 겹칩니다. 잠시 후 다시 저장하세요.'):e2}}
      toast('다른 사용자(창)의 변경 내용과 합쳐서 저장했습니다.');

  catch(e){const q=(e&&(e.name==='QuotaExceededError'||e.code===22));
    showErr('저장 실패: '+(q?'브라우저 저장 공간이 부족합니다.':(e.message||e))+' — 방금 변경한 내용은 저장되지 않았습니다. [백업 및 복원]에서 백업 파일을 내려받아 두세요.');

/* ---------------- 검측번호 ---------------- */
function numKeyOf(d){return `${d.siteId}|${fieldName(d.site)}|${d.round}`}
function buildNo(site,round,seq){const dg=Math.max(1,Math.min(5,+data.settings.seqDigits||2));

function maxExistingSeq(key,exceptId){let m=0;for(const o of data.inspections)if(o.id!==exceptId&&o.numKey===key&&+o.seq>m)m=+o.seq;return m}
function nextSeq(key,exceptId){return Math.max(+data.counters[key]||0,maxExistingSeq(key,exceptId))+1}
function resolveNo(d,commitIt){
  if(d.manualNo)return {docNo:(d.docNo||'').trim(),manual:true};
  if(d.docNo&&d.numKey&&(d.numKey.startsWith('re:')||d.numKey===numKeyOf(d)))return {docNo:d.docNo,seq:d.seq,numKey:d.numKey};

/* 행 단위 자동 쪽나눔: 넘치면 다음 쪽으로, 다음 쪽에는 문서번호와 표 제목행 반복 */
function paginate({d,firstHTML,contHTML,rows,blankRow,minRows,footerHTML,tsel}){
  const pages=[];let pg=mkPage(firstHTML);pages.push(pg);let tb=$(tsel+' tbody',pg),count=0;
  const newPage=()=>{pg=mkPage(contHTML);pages.push(pg);tb=$(tsel+' tbody',pg)};
  for(const r of rows){const tr=trOf(r);tb.appendChild(tr);
    if(over(pg)&&tb.children.length>1){tr.remove();newPage();tb.appendChild(tr)}count++}
  const fw=document.createElement('div');fw.innerHTML=footerHTML;$('.pbody',pg).appendChild(fw);
  if(over(pg)){fw.remove();const last=tb.lastElementChild;newPage();
    if(last&&last.parentNode&&last.parentNode.children.length>1){tb.appendChild(last)}
    $('.pbody',pg).appendChild(fw)}
  while(count<minRows){const tr=trOf(blankRow);tb.appendChild(tr);if(over(pg)){tr.remove();break}count++}
  pages.forEach((p,i)=>{reMark(d,p);if(pages.length>1){const n=document.createElement('div');n.className='pno';n.textContent=`${i+1} / ${pages.length}`;p.appendChild(n)}});
  return pages}

function csvExport(){const l=filtered();const H=['문서번호','결과통보번호','재검측','원검측번호','공사명','대공종','공종','세부공종','작업위치','검측부위','작성일','검측요구일','요구시간','시공자점검일','실제검측일','결과통보일','진행상태','검측결과','지시사항','참여인원','수정일'];

function copyBase(src,site){const id=uid();
  return normInsp({id,rootId:id,siteId:site.id,site:siteSnapshot(site),round:src.round,
    majorWork:src.majorWork,work:src.work,subWork:src.subWork,location:src.location,part:src.part,workContent:src.workContent,checkMatter:src.checkMatter,
    disp:clone(src.disp),attach:Object.assign(clone(src.attach)),resultAttach:src.resultAttach,showCmName:src.showCmName,
    checklist:{templateId:src.checklist.templateId,templateName:src.checklist.templateName,items:src.checklist.items.map(i=>({text:i.text,criterion:i.criterion,c:'',s:'',action:''}))},
    participants:src.participants.map(p=>({workerId:p.workerId,locWork:p.locWork,org:p.org,position:p.position,name:p.name,birth:p.birth,content:p.content,workDate:''})),
    status:'작성 중',needDateCheck:true})}
function copyInspection(id){const src=data.inspections.find(x=>x.id===id);if(!src)return;
  const site=data.sites.find(s=>s.id===src.siteId);if(!site){alert('원 검측의 현장이 삭제되어 복사할 수 없습니다.');return}
  openDraft(copyBase(src,site),true);toast('복사본을 만들었습니다. 날짜를 확인하고 저장하세요.')}
function reinspect(id){const src=data.inspections.find(x=>x.id===id);if(!src)return;
  const site=data.sites.find(s=>s.id===src.siteId);if(!site){alert('원 검측의 현장이 삭제되었습니다.');return}
  const d=copyBase(src,site);d.isRe=true;d.reOf=src.id;d.rootId=src.rootId;
  const root=data.inspections.find(x=>x.id===src.rootId)||src;d.reBaseNo=root.docNo;
  d.reIndex=Math.max(0,...data.inspections.filter(x=>x.rootId===src.rootId&&x.isRe).map(x=>+x.reIndex||0))+1;
  d.memo=`원 검측 ${src.docNo} 의 재검측`;openDraft(d,true);toast('재검측 기록을 만들었습니다. 원 검측의 상태는 직접 변경하세요.')}
function openDraft(d,isNew){state.draft=clone(d);state.isNew=isNew;state.dirty=!!isNew;state.clSel=new Set();state.ptSel=new Set();state.view='editor';render()}
function editInspection(id){const d=data.inspections.find(x=>x.id===id);if(!d)return;if(state.view==='editor'&&state.dirty&&!confirm('저장하지 않은 변경 내용이 사라집니다. 계속할까요?'))return;openDraft(d,false)}

function saveDraft(){const d=state.draft;
  if(!data.sites.find(s=>s.id===d.siteId)){alert('현장이 지정되지 않았습니다.');return false}
  if(!(+d.round>0)){alert('차수를 1 이상의 숫자로 입력하세요.');return false}
  if(d.manualNo&&!has(d.docNo)){alert('검측번호를 입력하세요.');return false}
  const miss=missingDates(d);
  if(d.needDateCheck&&miss.length&&!confirm(`다음 날짜가 비어 있습니다: ${miss.join(', ')}\n그래도 저장할까요?`))return false;
  const tryNo=resolveNo(d,false).docNo;const dup=dupOf(d,tryNo);
  if(dup){alert(`같은 현장에 이미 같은 검측번호가 있습니다: ${tryNo}\n번호를 수동으로 바꾸거나 차수를 확인하세요.`);return false}
  const prevSaved=data.inspections.find(x=>x.id===d.id);const prevPh=prevSaved?allPhotoIds([prevSaved]):[];
  const ok=commit(()=>{
    const rn=resolveNo(d,true);d.docNo=rn.docNo;
    if(rn.manual){d.numKey='manual';d.seq=null;
      const m=/(\d+)호$/.exec(d.docNo);if(m&&d.docNo===buildNo(d.site,d.round,+m[1])){const k=numKeyOf(d);d.numKey=k;d.seq=+m[1];data.counters[k]=Math.max(+data.counters[k]||0,+m[1])}}
    else{d.numKey=rn.numKey;d.seq=rn.seq??null}
    if(d.needDateCheck&&!miss.length)d.needDateCheck=false;
    d.updatedAt=nowISO();const rec=clone(d);
    const i=data.inspections.findIndex(x=>x.id===d.id);if(i>=0)data.inspections[i]=rec;else data.inspections.push(rec);
    data.settings.lastEditedId=d.id;state.pvId=d.id});
  if(!ok)return false;
  {const now=new Set(allPhotoIds([d]));prevPh.filter(id=>!now.has(id)).forEach(photoDel)}
  state.isNew=false;state.dirty=false;toast('저장했습니다: '+d.docNo);renderEditorForm();schedulePreview(true);return true}
function missingDates(d){const m=[];if(!has(d.writeDate))m.push('작성일');if(!has(d.reqDate))m.push('검측 요구일');if(!has(d.contractorCheckDate))m.push('시공자 점검일');
  if(!has(d.defaultWorkDate)&&d.participants.some(p=>!has(p.workDate)))m.push('작업일');return m}

function phRefresh(dirty=true){if(dirty)markDirty();const el=$('#phSec');if(el)el.innerHTML=phSectionHTML();schedulePreview(true);
  if(!SERVER){const miss=state.draft.photos.map(p=>p.photoId).filter(id=>!photoCache.has(id));if(miss.length)ensurePhotos(miss).then(ch=>{if(ch&&state.draft){const e=$('#phSec');if(e)e.innerHTML=phSectionHTML();schedulePreview(true)}})}}
async function addPhotos(files){const d=state.draft;if(!d)return;
  files=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|bmp|gif|heic)$/i.test(f.name));if(!files.length){alert('사진 파일(JPG·PNG)을 선택하세요.');return}
  const fails=[];let n=0;
  for(const f of files){n++;toast(`사진 처리 중 ${n} / ${files.length}`);
    try{const b=await compressImage(f);const id=uid();await photoPut(id,b);
      if(state.draft!==d)return;d.photos.push({id:uid(),photoId:id,work:'',content:'',location:'',date:''})}
    catch(e){fails.push(`${f.name}: ${/heic/i.test(f.name)?'HEIC(아이폰 기본 형식)는 지원하지 않습니다. JPG로 바꿔 주세요.':e.message}`)}}
  phRefresh();if(fails.length)showErr('추가하지 못한 사진 — '+fails.join(' / '));else toast(`사진 ${files.length}장을 추가했습니다.`)}

function renderPreview(){const box=$('#pvPages');if(!box||!state.draft)return;const d=state.draft,v=V(d);

  fitZoom();
  const nd=$('#noDisp');if(nd)nd.textContent=v.docNo;const nt=$('#noTent');if(nt)nt.textContent=v.tentative?'(저장 시 확정)':'';
  const rn=$('#resNoDisp');if(rn)rn.textContent=v.resNo;const ap=$('#attPrev');if(ap)ap.textContent=v.attach;
  $$('[data-auto]').forEach(el=>el.placeholder='자동: '+(v.auto[el.dataset.auto]||'(빈칸)'));

function validateBackup(o){const e=[];
  if(!o||typeof o!=='object')return ['JSON 객체가 아닙니다.'];
  if(o.format!==BACKUP_FORMAT)e.push(`이 프로그램의 백업 파일이 아닙니다 (format="${o.format??''}").`);
  if(o.photos!=null&&(typeof o.photos!=='object'||Array.isArray(o.photos)))e.push('사진 항목 형식이 올바르지 않습니다.');
  if(typeof o.version!=='number')e.push('백업 형식 버전이 없습니다.');else if(o.version>BACKUP_VERSION)e.push(`더 새로운 버전(${o.version})의 백업입니다. 프로그램을 최신으로 바꾼 뒤 복원하세요.`);
  const d=o.data;if(!d||typeof d!=='object')return e.concat(['data 항목이 없습니다.']);
  for(const k of ['sites','workers','templates','inspections'])if(!Array.isArray(d[k]))e.push(`${k} 목록이 없습니다.`);
  if(e.length)return e;
  const sid=new Set();d.sites.forEach((s,i)=>{if(!s||!has(s.id))e.push(`현장 ${i+1}: id 없음`);if(!has(s&&s.name))e.push(`현장 ${i+1}: 공사명 없음`);sid.add(s&&s.id)});
  d.workers.forEach((w,i)=>{if(!w||!has(w.id)||!has(w.name))e.push(`인력 ${i+1}: id 또는 성명 없음`)});
  d.templates.forEach((t,i)=>{if(!t||!has(t.id)||!Array.isArray(t.items))e.push(`템플릿 ${i+1}: id 또는 항목 목록 없음`)});
  const ids=new Set();d.inspections.forEach((x,i)=>{if(!x||!has(x.id))e.push(`검측 ${i+1}: id 없음`);else if(ids.has(x.id))e.push(`검측 ${i+1}: 중복 id`);ids.add(x&&x.id);
    if(!has(x&&x.docNo))e.push(`검측 ${i+1}: 검측번호 없음`);if(x&&!sid.has(x.siteId))e.push(`검측 ${i+1} (${x.docNo}): 연결된 현장이 백업에 없음`);
    if(x&&(!Array.isArray(x.checklist&&x.checklist.items)||!Array.isArray(x.participants)))e.push(`검측 ${i+1}: 체크리스트 또는 참여자 형식 오류`)});
  return e.slice(0,30)}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function exportBackup(){const ids=[...new Set(allPhotoIds(data.inspections))];const photos={},miss=[];let n=0;
  for(const id of ids){n++;if(ids.length>3)toast(`사진 담는 중 ${n} / ${ids.length}`);try{const b=await photoBlob(id);if(b)photos[id]=await blobToDataURL(b);else miss.push(id)}catch(e){miss.push(id)}}
  const o={format:BACKUP_FORMAT,version:BACKUP_VERSION,app:'검측서류 작성·관리',exportedAt:nowISO(),data:clone(data),photos};
  download(new Blob([JSON.stringify(o)],{type:'application/json'}),`검측서류_백업_${today()}.json`);
  if(miss.length)showErr(`사진 ${miss.length}장은 저장소에서 찾지 못해 백업에 넣지 못했습니다.`);else toast(`백업 파일을 내려받았습니다${ids.length?` (사진 ${ids.length}장 포함)`:''}.`)}
function handleRestore(file){const out=$('#bkResult');const r=new FileReader();
  r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){out.innerHTML=`<div class="banner" style="background:#fde8e8">JSON 파일을 읽을 수 없습니다: ${esc(e.message)}</div>`;return}
    const errs=validateBackup(o);

function onInput(e){const t=e.target;
  if(state.view==='editor'&&state.draft){const d=state.draft;
    if(t.dataset.f){const p=t.dataset.f;let v=t.type==='checkbox'?t.checked:t.value;
      if(p==='round')v=t.value===''?'':Math.max(1,parseInt(t.value,10)||1);
      if(p==='siteId'){const s=data.sites.find(x=>x.id===v);if(!s)return;d.siteId=s.id;d.site=siteSnapshot(s);d.numKey=null;d.docNo='';markDirty();renderEditorForm();schedulePreview(true);return}
      if(p==='manualNo'){if(v){d.docNo=V(d).docNo}else{if(d.numKey==='manual'){d.numKey=null;d.docNo=''}}d.manualNo=v;markDirty();renderEditorForm();schedulePreview(true);return}
      setPath(d,p,v);markDirty();
      if(p==='defaultWorkDate'||p==='writeDate'||p==='reqDate'||p==='contractorCheckDate'){const w=t.closest('.fld');if(w&&has(v))w.classList.remove('need')}
      schedulePreview();return}
    if(t.dataset.ci!=null){const it=d.checklist.items[+t.dataset.ci];if(it){it[t.dataset.cf]=t.value;markDirty();schedulePreview()}return}
    if(t.dataset.csel){if(t.checked)state.clSel.add(t.dataset.csel);else state.clSel.delete(t.dataset.csel);return}
    if(t.dataset.psel){state.ptSel=state.ptSel||new Set();if(t.checked)state.ptSel.add(t.dataset.psel);else state.ptSel.delete(t.dataset.psel);ptRefresh(false);return}
    if(t.id==='ptBulkDate'){state.ptBulkDate=t.value;return}
    if(t.dataset.pi!=null){const p=d.participants[+t.dataset.pi];if(p){p[t.dataset.pf]=t.value;markDirty();schedulePreview()}return}
    if(t.dataset.hi!=null){const p=d.photos[+t.dataset.hi];if(p){p[t.dataset.hf]=t.value;markDirty();schedulePreview()}return}
    if(t.id==='wkq'){const q=t.value.trim().toLowerCase();$$('#wkList label').forEach(l=>l.style.display=!q||l.dataset.s.includes(q)?'':'none');return}
  }
  if(t.dataset.lf){state.lf[t.dataset.lf]=t.value;renderLedgerBody();return}
  if(t.dataset.lgsel){if(t.checked)state.lgSel.add(t.dataset.lgsel);else state.lgSel.delete(t.dataset.lgsel);return}
  if(t.id==='wkSearch'){state.wq=t.value;clearTimeout(onInput.t);onInput.t=setTimeout(()=>{vWorkers();const s=$('#wkSearch');s.focus();s.setSelectionRange(s.value.length,s.value.length)},250);return}
  if(t.id==='pvSel'){state.pvId=t.value;vPreview();return}
}
function onChange(e){const t=e.target;

  if(t.dataset.tf||t.dataset.tk){const tp=curTpl();if(!tp)return;commit(()=>{if(t.dataset.tf)tp[t.dataset.tf]=t.value;else tp.items[+t.dataset.ti][t.dataset.tk]=t.value;tp.updatedAt=nowISO()});
    if(t.dataset.tf==='name')$$('.list-pick a.on').forEach(a=>a.firstChild.textContent=t.value||'(이름 없음)');toast('템플릿 저장됨');return}
  if(t.dataset.wf){const w=data.workers.find(x=>x.id===t.dataset.id);if(w){commit(()=>{w[t.dataset.wf]=t.type==='checkbox'?t.checked:t.value.trim()});toast('인력대장 저장됨')}return}
  if(t.dataset.sy){commit(()=>{data.settings.symbols[t.dataset.sy]=t.value});toast('저장됨');return}
  if(t.dataset.st){const k=t.dataset.st;let v=t.type==='checkbox'?t.checked:t.value;if(k==='seqDigits')v=Math.max(1,Math.min(5,parseInt(v,10)||2));
    if(k==='photoPerPage')v=+v===2?2:4;
    commit(()=>{data.settings[k]=v});if(k==='docFont')applyFont();toast('설정 저장됨');if(state.view==='editor'&&state.draft){if(k.startsWith('photo'))phRefresh(false);else schedulePreview(true)}if(k==='seqDigits')vBackup();return}
  if(t.id==='bkFile'&&t.files[0]){handleRestore(t.files[0]);t.value='';return}
  if(t.id==='phFile'&&t.files.length){const fs=[...t.files];t.value='';addPhotos(fs);return}
  if(t.id==='curSite'){if(state.view==='editor'&&state.dirty&&!confirm('저장하지 않은 변경 내용이 사라집니다. 계속할까요?')){renderHeader();return}
    commit(()=>{data.settings.currentSiteId=t.value});if(state.view==='editor'){state.draft=null;state.dirty=false}state.siteSel=t.value;render();return}
  if(state.view==='editor'&&(t.dataset.f||t.dataset.ci!=null||t.dataset.pi!=null||t.dataset.csel))onInput(e);
}
document.addEventListener('input',e=>{if(e.target.type==='checkbox'||e.target.tagName==='SELECT')return;onInput(e)});
document.addEventListener('change',e=>{const t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT'){if(t.dataset.f||t.dataset.ci!=null||t.dataset.csel||t.dataset.psel||t.dataset.lf||t.dataset.lgsel||t.id==='pvSel'){onInput(e);return}}onChange(e)});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();const z=$('#phDrop');if(z)z.classList.toggle('on',!!e.target.closest('#phSec'))}});
document.addEventListener('dragleave',e=>{const z=$('#phDrop');if(z&&!e.relatedTarget)z.classList.remove('on')});
document.addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();const z=$('#phDrop');if(z)z.classList.remove('on');
  if(state.view==='editor'&&state.draft)addPhotos([...e.dataTransfer.files]);else toast('사진은 검측 작성 화면의 사진대지 칸에 끌어다 놓으세요.')});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&state.view==='editor'&&state.draft){e.preventDefault();saveDraft()}});
window.addEventListener('beforeunload',e=>{if(state.view==='editor'&&state.dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('storage',e=>{if(!SERVER&&e.key===STORE_KEY)showErr('다른 탭에서 데이터가 변경되었습니다. 덮어쓰기를 막으려면 이 탭을 새로고침하세요.')});

load();render();if(!state.loadFailed)setTimeout(sweepPhotos,3000);
/* 다른 사용자(창)가 저장한 내용을 30초마다 확인해 반영 (작성 중인 서류는 건드리지 않음) */
if(SERVER&&!state.loadFailed)setInterval(async()=>{
  if(document.hidden)return;
  try{const r=await fetch('/api/rev',{cache:'no-store'});if(r.status===401){toLogin();return}if(!r.ok)return;const rv=(await r.text()).trim();
    if(!rv||rv===serverRev)return;
    const theirs=fetchTheirs();const m=threeWay(JSON.parse(baseSnap||'{}'),data,theirs);data=normalizeData(m.out);applyLocalPrefs();baseSnap=JSON.stringify(theirs);
    const f=document.activeElement;const typing=f&&/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName);
    if(state.view==='editor'&&state.draft){renderHeader()}else if(!typing&&!$('#modalBg')){render()}
    $('#saveState').textContent='최신 내용 반영 · '+fLocal(nowISO()).slice(11)}catch(e){}},30000);
</script>
</body>
</html>
