# Android Gradle 빌드 기본 설정
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 앱이 열 웹앱 주소는 아래 세 가지로 덮어쓸 수 있다(위에서부터 우선).
#   1) 빌드 인자: ./gradlew assembleDebug -PappUrl=https://example.com
#   2) 환경변수:   APP_URL=https://example.com ./gradlew assembleDebug
#   3) local.properties: appUrl=https://example.com
# 지정하지 않으면 https://family-album.onrender.com 을 사용한다.
#appUrl=https://family-album.onrender.com
android.suppressUnsupportedCompileSdk=36
