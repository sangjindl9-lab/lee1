<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>슬롯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/shared/shell.css?v=1793420815">
</head>
<body>
<canvas id="bg"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<nav class="topbar"><a href="/lobby">← 게임 목록</a></nav>

<div class="app" id="app">
  <div class="title"><span class="seal" id="gSeal"></span><h1 id="gTitle"></h1></div>
  <div class="mode" id="mode"></div>
  <div class="cabinet" id="cab">
    <div class="reels" id="reels"><svg class="lines" id="lines" preserveAspectRatio="none"></svg></div>
    <div class="winbar" id="winbar"></div>
  </div>
  <div class="deck">
    <div class="meter"><span>보유 금액</span><b id="bal">0</b></div>
    <button class="spin" id="spin" aria-label="스핀 (스페이스바)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a1606" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      <span class="auto" id="autoN" hidden></span>
    </button>
    <div class="meter r"><span id="winLbl">당첨</span><b id="win">0.00</b></div>
  </div>
  <div class="row">
    <div class="grp">
      <button class="btn ic" id="betDn" aria-label="베팅 낮추기">−</button>
      <div class="bet" id="bet"></div>
      <button class="btn ic" id="betUp" aria-label="베팅 올리기">+</button>
    </div>
    <div class="grp">
      <button class="btn" id="auto">자동</button>
      <button class="btn" id="turbo">터보</button>
      <button class="btn ic" id="snd" aria-label="소리 켜기/끄기">🔊</button>
      <button class="btn ic" id="info" aria-label="게임 정보">i</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status"></div>

<div class="ov" id="ovStart" hidden><div class="card">
  <h2 id="startTitle"></h2><div id="startBody"></div>
  <button class="btn cta" id="go">시작하기</button>
  <div class="hint">스페이스바로 스핀 · 결과는 서버에서 결정됩니다</div>
</div></div>
<div class="ov" id="ovFree" hidden><div class="card">
  <h2 id="freeTitle"></h2><p id="freeSub"></p>
  <div class="scrollbox"><div class="paper"></div><div class="rod l"></div><div class="rod r"></div><div class="pick" id="pick"></div></div>
  <p id="freeName" style="font-family:var(--display);font-weight:900;color:var(--gold-hi);font-size:20px;min-height:30px"></p>
  <button class="btn cta" id="freeGo" hidden>무료 회전 시작</button>
</div></div>
<div class="ov" id="ovBig" hidden><div class="card">
  <div class="tier" id="tier"></div><div class="big" id="bigAmt">0</div>
  <p id="bigSub" style="color:var(--mist)"></p><button class="btn cta" id="bigGo" hidden>계속</button>
</div></div>
<div class="ov" id="ovEnd" hidden><div class="card">
  <h2>무료 회전 종료</h2><p>총 획득</p><div class="big" id="endAmt">0</div>
  <button class="btn cta" id="endGo" hidden>계속</button>
</div></div>
<div class="ov" id="ovInfo" hidden><div class="card">
  <h2 style="font-size:30px">게임 정보</h2>
  <p style="color:var(--mist);font-size:13px">현재 베팅 기준 당첨 금액</p>
  <div class="pay" id="payGrid"></div>
  <div class="rules" id="rules"></div>
  <button class="btn cta" id="infoClose">닫기</button>
</div></div>

<script src="/shared/audio.js?v=1793420815"></script>
<script src="/shared/fx.js?v=1793420815"></script>
<script src="/shared/shell.js?v=1793420815"></script>
</body>
</html>
