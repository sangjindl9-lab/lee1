name: 현장뷰 APK 빌드
on:
  push:
    branches: [siteview]
    paths: ['app/**', '.github/workflows/siteview-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 패키지 설치
        run: npm install
      - name: 웹 화면을 안드로이드에 반영
        run: npx cap sync android
      - name: APK 빌드
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../siteview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: siteview-apk
          path: siteview.apk
      - name: 다운로드 페이지(릴리스)에 올리기
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete siteview-latest --yes --cleanup-tag || true
          gh release create siteview-latest siteview.apk \
            --target "$GITHUB_SHA" \
            --title "현장뷰 앱 (최신)" \
            --notes "휴대폰에서 siteview.apk를 눌러 내려받아 설치한 뒤, 현장뷰 서버 주소를 입력하세요."
