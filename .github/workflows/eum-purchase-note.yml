name: 이음 구매노트 APK 빌드·검수
on:
  push:
    branches: [eum-purchase-note]
    paths-ignore: ["site/**", "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: 단위 테스트 + 테스트 APK 빌드
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon 2>&1 | tee build.log
      - name: 단위 테스트 결과
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > tests.txt || true
          import glob, xml.etree.ElementTree as ET
          tot=fail=0
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              r=ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  tot+=1; bad=[c for c in tc if c.tag in('failure','error')]; fail+=bool(bad)
                  print(('FAIL ' if bad else 'PASS ')+tc.get('classname').split('.')[-1]+'.'+tc.get('name'))
                  for b in bad: print('    '+(b.get('message') or '')[:400])
          print(f'TOTAL {tot}, FAILED {fail}')
          PY
          cat tests.txt
      - name: 실패 로그 올리기
        if: failure()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Exception|warning:.*unresolved" -A3 build.log | head -400 > errors.txt || true
          # 공개 저장소에서 로그인 없이 볼 수 있도록 오류를 주석(annotation)으로도 남긴다 (여러 줄을 묶어 9개 이하)
          python3 - <<'PY'
          import re
          log = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          errs = [re.sub(r'^e: file://\S*/app/src/', 'app/src/', l) for l in log if l.startswith('e: ') or l.startswith('ERROR') or ' error:' in l]
          i = next((k for k, l in enumerate(log) if 'What went wrong' in l), None)
          if i is not None: errs.append(' / '.join(log[i:i + 8]))
          try: errs += [l for l in open('tests.txt') if l.startswith('FAIL') or l.startswith('    ')][:40]
          except Exception: pass
          chunk, out = '', []
          for e in errs[:120]:
              e = e.strip().replace('%', '%25')
              if len(chunk) + len(e) > 3500: out.append(chunk); chunk = ''
              chunk += e + '%0A'
          if chunk: out.append(chunk)
          for c in out[:9]: print('::error::' + c)
          PY
          touch tests.txt
          gh release create eum-purchase-note-buildlog build.log errors.txt tests.txt --target "$GITHUB_SHA" --prerelease --title "이음 구매노트 빌드 로그" --notes "빌드 실패 로그"
      - name: APK 권한 확인
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          echo "== APK 권한 (실제 빌드 결과)" >> tests.txt
          $AAPT dump permissions app/build/outputs/apk/debug/app-debug.apk | tee -a tests.txt
      - name: APK 정리
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app-debug-androidTest.apk
          cp app-debug.apk eum-purchase-note-internal-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: "app-debug*.apk" }
      - name: 사내 테스트 APK 올리기
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete eum-purchase-note-buildlog --yes --cleanup-tag || true
          gh release delete eum-purchase-note-latest --yes --cleanup-tag || true
          gh release create eum-purchase-note-latest eum-purchase-note-internal-test.apk tests.txt --target "$GITHUB_SHA" --prerelease \
            --title "이음 구매노트 (사내 테스트 APK · 스토어 배포용 아님)" \
            --notes "디버그 서명된 사내 테스트용 APK입니다. Google Play 배포용(서명된 AAB)이 아닙니다. 휴대폰에서 내려받아 설치하세요 (Android 8.0 이상)."

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apks }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터 검수
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/emu/test.sh || true
      - name: 결과 올리기
        if: always()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ls emu || exit 0
          cd emu && rm -f ui.xml && zip -q ../emu-results.zip * && cd ..
          gh release delete eum-purchase-note-test --yes --cleanup-tag || true
          gh release create eum-purchase-note-test emu/report.txt emu/ocr_log.txt emu-results.zip --target "$GITHUB_SHA" --prerelease \
            --title "이음 구매노트 에뮬레이터 검수 결과" --notes "에뮬레이터(실기기 아님) 자동 검수 결과"
