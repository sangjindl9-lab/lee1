name: Build EUM SAFE APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, eum-safe]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EUM-SAFE-install-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to branch
        run: |
          mkdir -p apk && cp app/build/outputs/apk/debug/app-debug.apk apk/EUM_SAFE_1.0.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f apk/EUM_SAFE_1.0.apk && git commit -m "Add built APK [skip ci]" && git push
