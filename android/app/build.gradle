plugins { id 'com.android.application' }
android {
  namespace 'kr.ssjr.narabid'
  compileSdk 34
  defaultConfig {
    applicationId 'kr.ssjr.narabid'
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
