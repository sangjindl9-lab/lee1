name: FileManager2 screenshots
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/shots.sh
      - name: Publish screenshots
        run: |
          mkdir /tmp/pub && cp shots/*.png /tmp/pub/
          cd /tmp/pub
          git init -q -b filemanager2-shots
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add . && git commit -qm "screenshots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" filemanager2-shots
