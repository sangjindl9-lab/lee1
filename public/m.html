<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCTV 현장 확인</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  body { background: #f2f4f6; }
  .mtop { position: sticky; top: 0; background: #1e2a36; color: #fff; padding: 10px 14px; display: flex; gap: 8px; align-items: center; z-index: 5; }
  .mtop button { background: transparent; color: #fff; border-color: #445; }
  .mwrap { padding: 12px 14px; max-width: 720px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 8px; }
  .card.click { cursor: pointer; }
  .mbtn { padding: 10px 12px; font-size: 15px; }
  .mview { position: relative; height: 55vh; background: #fff; border: 1px solid var(--line); overflow: hidden; touch-action: none; }
  .mview svg { width: 100%; height: 100%; }
  input.msearch { width: 100%; padding: 9px; font-size: 15px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 8px; font-size: 14px; }
</style>
<script src="/shared/catalog.js"></script><script src="/shared/calc.js"></script><script src="/shared/symbols.js"></script>
</head>
<body>
<div class="mtop"><button id="mBack">←</button><b id="mTitle">CCTV 현장 확인</b><span class="grow"></span><a href="/" style="color:#9cc">PC 화면</a></div>
<div class="mwrap" id="mBody"></div>
<div class="toast" id="toast"></div>
<script type="module" src="/js/mobile.js"></script>
</body>
</html>
