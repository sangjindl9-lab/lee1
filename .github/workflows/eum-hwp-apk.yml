name: 이음한글 APK 빌드
on:
  push:
    branches: [eum-hwp]
    paths: ['app/**', '.github/workflows/eum-hwp-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 패키지 설치
        run: npm install
      - name: 웹 화면을 안드로이드에 반영
        run: npx cap sync android
      - name: APK 빌드
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../eum-hwp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eum-hwp-apk
          path: eum-hwp.apk
      - name: 다운로드 페이지(릴리스)에 올리기
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete eum-hwp-latest --yes --cleanup-tag || true
          gh release create eum-hwp-latest eum-hwp.apk \
            --target "$GITHUB_SHA" \
            --title "이음한글 앱 (최신)" \
            --notes "휴대폰에서 eum-hwp.apk를 눌러 내려받아 설치하세요. hwp · hwpx 문서를 열고 편집해 같은 형식으로 저장합니다."
