<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>업데이트 내역 — 파일 관리자 2 PC CONNECT</title><meta name="description" content="휴대폰과 PC, 클라우드의 모든 파일을 하나로 연결하세요.">
<link rel="icon" href="/icon.png"><link rel="stylesheet" href="/site.css"></head><body>
<main class="wrap doc"><section class="hero" style="padding-bottom:0"><h1>업데이트 내역</h1></section>
<div id="list"><p style="color:var(--sub)">불러오는 중…</p></div>
<h2>Android 앱</h2><div class="rel"><b>1.5</b> — PC 연결 메뉴 추가 (계정 로그인, PC 승인·허용 폴더, 연결 코드, 연결 기록)</div>
<div class="rel"><b>1.4</b> — 앱 실행 시 업데이트 안내</div>
<div class="rel"><b>1.3</b> — 다크 모드 글자색 수정</div>
<div class="rel"><b>1.2</b> — 첫 공개: 파일 탐색·정리, 압축, 휴지통, 저장소 분석(큰 파일·중복 파일)</div>
</main>
<script src="/site.js"></script><script>fetch("/api/releases").then(r=>r.json()).then(l=>{const el=document.getElementById("list");if(!l.length){el.innerHTML="<p class=notice>아직 배포된 Windows 버전이 없습니다.</p>";return;}el.innerHTML="<h2>Windows 프로그램</h2>"+l.map(r=>`<div class=rel><b>v${r.version}</b> · ${fmt.date(r.publishedAt)} · ${fmt.size(r.size)}<pre>${(r.notes||"").replace(/[<>&]/g,"")}</pre></div>`).join("");})</script></body></html>
