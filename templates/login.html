<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 트레이더 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--sub:#6b7280;--line:#e5e7eb;--acc:#2f5bea}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaee;--sub:#9aa1ad;--line:#262a33;--acc:#6b8cff}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;width:min(340px,calc(100% - 32px))}
  h1{font-size:18px;margin:0 0 4px} p{color:var(--sub);font-size:13px;margin:0 0 20px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
  button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .err{color:#e5484d;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<form method="post">
  <h1>AI 트레이더</h1>
  <p>대시보드 비밀번호를 입력하세요.</p>
  <input type="password" name="pw" autofocus autocomplete="current-password">
  <button>로그인</button>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
</form>
</body>
</html>
