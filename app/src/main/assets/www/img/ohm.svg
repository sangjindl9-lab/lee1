<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Arial,Helvetica,sans-serif" font-size="15"><rect width="520" height="300" fill="#fff"/><style>.w{fill:none;stroke:#1d2733;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.L{fill:none;stroke:#B5651D;stroke-width:4}.N{fill:none;stroke:#1E63D6;stroke-width:4}.E{fill:none;stroke:#2EA043;stroke-width:4;stroke-dasharray:10 6}.S{fill:none;stroke:#E08A00;stroke-width:4}.t{fill:#1d2733}.b{font-weight:bold}.box{fill:#F3F6FA;stroke:#1d2733;stroke-width:2.5}</style><polygon points="160,30 40,250 280,250" fill="#FFF3C4" stroke="#1d2733" stroke-width="3"/><line x1="90" y1="160" x2="230" y2="160" stroke="#1d2733" stroke-width="3"/><line x1="160" y1="160" x2="160" y2="250" stroke="#1d2733" stroke-width="3"/><text x="160" y="135" text-anchor="middle" class="t b" font-size="44">V</text><text x="110" y="225" text-anchor="middle" class="t b" font-size="40">I</text><text x="210" y="225" text-anchor="middle" class="t b" font-size="40">R</text><text x="320" y="90" text-anchor="start" class="t b" font-size="24">V = I × R</text><text x="320" y="150" text-anchor="start" class="t b" font-size="24">I = V / R</text><text x="320" y="210" text-anchor="start" class="t b" font-size="24">R = V / I</text></svg>