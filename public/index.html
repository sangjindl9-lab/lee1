<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>에스에스전력 발주서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 탭 바 + 작업 패널. 발주서 작성 탭은 입력(좌) / A4 미리보기(우), 좁은 화면에서는 위아래로 쌓임 */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#1B2430; --muted:#5B6878; --line:#D3DAE2;
  --accent:#A8281F; --accent-ink:#FFFFFF; --accent-soft:#F7E6E4; --ok:#1F7A4D; --warn:#9A5B00;
  --paper:#FFFFFF; --paper-ink:#111111;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-sheet:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1A2129; --surface-2:#212A34; --ink:#E6EBF0; --muted:#9AA7B5; --line:#2F3A46;
  --accent:#E0574B; --accent-ink:#1A0B09; --accent-soft:#3A1F1C; --ok:#4FC28A; --warn:#E3A341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1A2129; --surface-2:#212A34; --ink:#E6EBF0; --muted:#9AA7B5; --line:#2F3A46;
  --accent:#E0574B; --accent-ink:#1A0B09; --accent-soft:#3A1F1C; --ok:#4FC28A; --warn:#E3A341; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;padding-block:12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.seal{width:22px;height:22px;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-size:11px;display:grid;place-items:center;font-weight:700}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:13px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px}
h2{font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:56px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.split{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.checks label{display:flex;gap:5px;align-items:center;cursor:pointer}
.checks input{width:auto}
/* items editor */
.items{display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 56px 64px;gap:6px;background:var(--surface-2)}
.it input{padding:6px 8px;font-size:13px;background:var(--surface)}
.it .w2{grid-column:span 2}
.it .acts{grid-column:span 2;display:flex;justify-content:flex-end;gap:4px;align-items:center}
.it .amt{margin-right:auto;margin-left:8px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.sum-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-variant-numeric:tabular-nums}
.sum-box div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-box span{font-size:11.5px}
.sum-box b{font-size:14px;overflow-wrap:anywhere}
.sum-box .tot b{color:var(--accent);font-size:15px}
.it .no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.picker{position:relative}
.results{border:1px solid var(--line);border-radius:6px;margin-top:6px;max-height:260px;overflow:auto;background:var(--surface)}
.results button{display:flex;width:100%;text-align:left;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;cursor:pointer}
.results button:hover{background:var(--surface-2)}
.results .m{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center}
/* preview */
.pv-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.pv{display:flex;flex-direction:column;gap:14px;align-items:center}
.pv-page{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--line);overflow:hidden}
.pv-page>.sheet{transform-origin:top left}
.pv-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .nm{font-weight:700;font-size:15px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 8px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2)}
.drop.on{border-color:var(--accent);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.sig-prev{height:60px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:#fff;max-width:240px}
.sig-prev img{max-height:54px}

/* ===== 발주서 양식 (종이: 테마와 무관하게 항상 흰 바탕) ===== */
.sheet{width:794px;height:1123px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-sheet);padding:50px 40px 30px;position:relative}
.sheet *{color:var(--paper-ink)}
.frame{border:1.4px solid var(--paper-ink);padding:10px 18px 16px}
.s-title{text-align:center;font-size:29px;font-weight:500;letter-spacing:.32em;margin:4px 0 6px}
.s-title span{border-bottom:1.5px solid var(--paper-ink);padding:0 0 1px .32em}
.s-line{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:0 0 6px;white-space:nowrap}
.s-line small{font-size:13px}
.s-line .site{max-width:400px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
table.form{width:675px;border-collapse:collapse;table-layout:fixed;font-size:13.5px}
table.form td{border:1px solid var(--paper-ink);height:31px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.form tr.ir td{height:25.6px;font-size:13px}
table.form tr.tr td{height:30px;border-top:1.6px solid var(--paper-ink)}
table.form tr.hd td{height:27px;text-align:center;font-weight:700;font-size:14.5px}
.lb{display:inline-block;width:64px;text-align:justify;text-align-last:justify;margin:0 6px 0 10px}
.lbr{text-align:justify;text-align-last:justify;padding:0 8px!important;font-size:14px}
.vb{text-align:center;font-weight:700;font-size:16px;letter-spacing:.22em}
.vc{text-align:center}
.r{text-align:right}
.c{text-align:center}
.bold{font-weight:700}
td.yb{position:relative}
.yb-row{display:flex;align-items:center;gap:10px;font-size:13.5px;letter-spacing:.9em;justify-content:center}
.yb-row i{flex:1;border-top:1px dashed var(--paper-ink);height:0}
.special{height:48px!important;vertical-align:top!important;padding-top:6px!important}
.cb{display:inline-block;width:15px;height:15px;border:1px solid var(--paper-ink);vertical-align:-3px;margin:0 6px 0 4px;text-align:center;line-height:13px;font-size:12px;font-weight:700}
.chk{display:flex;justify-content:space-between;padding-right:4px}
table.appr{border-collapse:collapse;margin:10px 0 0 auto;font-size:14px}
table.appr td{border:1px solid var(--paper-ink);text-align:center;padding:0}
table.appr .h td{height:28px;letter-spacing:.5em;padding-left:.5em}
table.appr .s td{height:54px}
table.appr img{max-width:84px;max-height:48px;display:block;margin:0 auto}
td.stampcell{position:relative;overflow:visible!important}
.stamp{position:absolute;right:2px;top:-16px;width:64px;height:64px;object-fit:contain;mix-blend-mode:multiply;z-index:2}
.pg{position:absolute;right:44px;bottom:12px;font-size:11px}
#render-host{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}
#print-host{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff!important}
  body::before,header.top,main,#toast,#render-host{display:none!important}
  #print-host{display:block}
  #print-host .sheet{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-host .sheet:last-child{break-after:auto;page-break-after:auto}
}
.login-wrap{max-width:380px;margin:8vh auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="seal">발</span>에스에스전력 발주서</div>
  <nav role="tablist" id="nav">
    <button data-tab="order" aria-selected="true">발주서 작성</button>
    <button data-tab="history">발주 이력</button>
    <button data-tab="vendors">업체 등록</button>
    <button data-tab="materials">자재 목록</button>
  </nav>
  <button class="btn sm" id="logout" type="button" hidden>로그아웃</button>
</div></header>
<main id="app"><div class="empty">불러오는 중…</div></main>
<div id="render-host" aria-hidden="true"></div>
<div id="print-host" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
const ROWS = 18;               // 양식 1장당 자재 행 수 (마지막 줄은 합계)
// 합계: 단가가 VAT 별도이면 공급가액=Σ, 부가세=10%; VAT 포함이면 합계=Σ에서 공급가액을 역산
function totals(items, vat){
  const sum = items.reduce((a,it)=>a + Math.round(num(it.qty)*num(it.price)), 0);
  if (vat==="포함"){ const supply=Math.round(sum/1.1); return { supply, tax:sum-supply, total:sum, sum }; }
  const tax=Math.round(sum*0.1); return { supply:sum, tax, total:sum+tax, sum };
}
const CHUNK = 400;             // 자재 저장 묶음 크기
const INSPECT = ["외관","치수","기타","성적서","입회검사"];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(String(v ?? "").replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const fmt = v => { if (v === "" || v == null) return ""; const n = num(v); return n ? n.toLocaleString("ko-KR") : (String(v).trim()==="0"?"0":""); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const kDate = s => { if(!s) return "&nbsp;&nbsp;&nbsp;&nbsp;년 &nbsp;&nbsp; 월 &nbsp;&nbsp; 일"; const [y,m,d]=s.split("-"); return `${y}년 ${Number(m)} 월 ${Number(d)} 일`; };
const toast = (msg) => { const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); };
const ls = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

/* ---------- state ---------- */
const S = {
  tab: "order", db: null, dl: null, dbState: "loading",
  company: { name:"", manager:"", phone:"", fax:"", place:"", placeManager:"", signature:"" },
  vendors: [], materials: [], matChunks: 0, orders: [],
  draft: null, search: "", matSearch: "", matEdit: null, vendorEdit: null, vendorKind: "buyer", pendingImport: null, confirm: null,
};
const buyers = () => S.vendors.filter(v => v.kind === "buyer");
const suppliers = () => S.vendors.filter(v => !v.kind || v.kind === "supplier");
const staffList = () => S.vendors.filter(v => v.kind === "staff");
const byKind = k => k==="buyer"?buyers():k==="staff"?staffList():suppliers();
const staffLabel = p => p ? `${p.name||""}${p.title||""}${p.phone?"("+p.phone+")":""}` : "";
function blankDraft(){
  const b = (S.draft && buyers().find(x => x.id === S.draft.buyerId)) || buyers()[0] || null;
  const p = (S.draft && staffList().find(x => x.id === S.draft.staffId)) || null;
  return { id:null, site:"", date:today(), buyerId:b?.id||"", buyer:b, staffId:p?.id||"", staff:p, vendorId:"", vendor:null, due:"", payment:"", special:"",
    place:b?.place||"", placeManager:p?staffLabel(p):(b?.placeManager||""), inspect:{}, items:[], vat:"별도" };
}
function applyStaff(id){
  const p = staffList().find(x => x.id === id) || null;
  S.draft.staffId = id; S.draft.staff = p;
  if (p) S.draft.placeManager = staffLabel(p);
}
function applyBuyer(id){
  const b = buyers().find(x => x.id === id) || null;
  S.draft.buyerId = id; S.draft.buyer = b;
  if (b){ if (b.place) S.draft.place = b.place; if (b.placeManager && !S.draft.staffId) S.draft.placeManager = b.placeManager; }
}
S.draft = ls.get("po-draft") || blankDraft();
const saveDraft = () => ls.set("po-draft", S.draft);

/* ---------- server ---------- */
const API = {
  token: ls.get("po-token"),
  async call(method, path, body){
    let r;
    try { r = await fetch("/api/"+path, { method, headers:{ "content-type":"application/json", authorization:"Bearer "+(API.token||"") }, body: body!==undefined ? JSON.stringify(body) : undefined }); }
    catch(e){ throw { msg:"인터넷 연결을 확인해 주세요." }; }
    let data = {}; try { data = await r.json(); } catch(_){}
    if (r.status===401 && path!=="login"){ logout(true); throw { msg:"다시 로그인해 주세요." }; }
    if (!r.ok) throw { msg: data.error || "서버 오류가 발생했습니다." };
    return data;
  }
};
const sortV = l => l.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ko"));
const sortO = l => l.sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.savedAt||"").localeCompare(a.savedAt||""));
let matSaving = false, matTimer = null;
function logout(expired){
  API.token=null; ls.set("po-token",null); S.db=null; S.dbState="login"; render();
  if (expired) toast("로그인이 만료되었습니다. 다시 로그인해 주세요.");
}
async function loadAll(){
  const d = await API.call("GET","all");
  S.vendors = sortV(d.vendors||[]);
  S.orders = sortO(d.orders||[]);
  if (!matSaving) S.materials = d.materials||[];
  S.db = API; S.dbState = "ok";
  if (!S.draft.buyerId && buyers().length && !S.draft.id){ applyBuyer(buyers()[0].id); saveDraft(); }
  if (!S.draft.staffId && staffList().length===1 && !S.draft.id){ applyStaff(staffList()[0].id); saveDraft(); }
}
async function initDb(){
  if (!API.token){ S.dbState="login"; render(); return; }
  S.dbState="loading"; render();
  try { await loadAll(); }
  catch(e){ if (S.dbState!=="login"){ S.dbState="error"; S.loadErr=e.msg; } }
  render();
}
async function refresh(){
  if (S.dbState!=="ok" || matSaving) return;
  try { await loadAll(); rerender("vendors"); rerender("materials"); rerender("orders"); } catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refresh(); });
setInterval(()=>{ if (!document.hidden) refresh(); }, 60000);
function saveMaterials(){
  rerender("materials");
  clearTimeout(matTimer);
  matSaving = true;
  matTimer = setTimeout(async () => {
    try { const r = await API.call("PUT","materials",{ items:S.materials }); toast(`자재 ${Number(r.count||0).toLocaleString()}건 저장됨`); }
    catch(e){ toast(e.msg || "자재 저장에 실패했습니다. 다시 시도해 주세요."); }
    matSaving = false;
  }, 400);
}
async function dbSet(path, data){
  const [col,id] = path.split("/");
  try { await API.call("PUT","doc/"+path, data); }
  catch(e){ toast(e.msg || "저장하지 못했습니다."); return false; }
  const list = S[col].filter(x=>x.id!==id); list.push({ ...data, id });
  S[col] = col==="vendors" ? sortV(list) : sortO(list);
  return true;
}
async function dbDel(path){
  const [col,id] = path.split("/");
  try { await API.call("DELETE","doc/"+path); }
  catch(e){ toast(e.msg || "삭제하지 못했습니다."); return false; }
  S[col] = S[col].filter(x=>x.id!==id);
  return true;
}

/* ---------- sheet (양식) ---------- */
function paginate(items){
  const filled = items.filter(it => (it.name||it.spec||it.qty||it.price||it.note));
  const pages = []; for (let i=0;i<Math.max(1,filled.length);i+=ROWS) pages.push(filled.slice(i,i+ROWS));
  return pages;
}

function totalRow(o, pageNo, total){
  const vat = o.vat==="포함" ? "포함" : "별도";
  const ck = k => `<span class="cb">${vat===k?"✓":""}</span>`;
  const vatCell = `<td colspan="2" class="c" style="font-size:12.5px">VAT ${ck("포함")}포함 ${ck("별도")}별도</td>`;
  if (pageNo!==total) return `<tr class="tr"><td class="c bold" style="letter-spacing:.3em">합 계</td><td colspan="4" class="c">다음 장에 이어집니다</td>${vatCell}</tr>`;
  const t = totals(paginate(o.items).flat(), vat);
  const val = t.sum ? `<b style="font-size:15px">${t.total.toLocaleString("ko-KR")}원</b> <span style="font-size:11.5px">(공급가 ${t.supply.toLocaleString("ko-KR")} + 부가세 ${t.tax.toLocaleString("ko-KR")})</span>` : "";
  return `<tr class="tr"><td class="c bold" style="letter-spacing:.3em">합 계</td><td colspan="4" class="r" style="padding-right:10px">${val}</td>${vatCell}</tr>`;
}
function draftOrderObj(){
  const v = suppliers().find(x => x.id === S.draft.vendorId) || S.draft.vendor || null;
  const b = buyers().find(x => x.id === S.draft.buyerId) || S.draft.buyer || S.draft.company || {};
  const p = staffList().find(x => x.id === S.draft.staffId) || (S.draft.staffId ? S.draft.staff : null) || null;
  return { ...S.draft, vendor:v, buyer:b, company:b, staff:p };
}

function renderResults(){

/* ---------- excel ---------- */
const HMAP = { name:["품명","자재명","품목","품목명","명칭"], spec:["규격","사양","규격/사양","모델"], unit:["단위"], price:["단가","가격","금액(단가)","단가(원)"], note:["비고","메모","적요"] };
function parseSheet(ab){
  const wb = XLSX.read(ab, {type:"array"}); const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
  let hr = -1, cols = {name:0,spec:1,unit:2,price:3,note:4};
  for (let r=0;r<Math.min(15,aoa.length);r++){
    const row = aoa[r].map(x=>String(x).replace(/\s/g,""));
    const ni = row.findIndex(x=>HMAP.name.includes(x));
    if (ni>=0){ hr=r; cols={}; for (const k in HMAP){ cols[k]=row.findIndex(x=>HMAP[k].includes(x)); } break; }
  }
  const out=[]; let skipped=0;
  for (let r=hr+1;r<aoa.length;r++){
    const row=aoa[r]; const g=k=>cols[k]>=0?String(row[cols[k]]??"").trim():"";
    const it={name:g("name"),spec:g("spec"),unit:g("unit"),price:g("price").replace(/[^0-9.\-]/g,""),note:g("note")};
    if(!it.name){ if(it.spec||it.unit||it.price) skipped++; continue; }
    out.push(it);
  }
  return {rows:out, skipped};
}
async function handleFile(f){
  if(!f) return;
  try{ const r = parseSheet(await f.arrayBuffer()); if(!r.rows.length){ toast("읽을 자재가 없습니다. 첫 줄에 ‘품명’ 제목이 있는지 확인해 주세요."); return; } S.pendingImport={file:f.name, ...r}; render(); }
  catch(e){ console.warn(e); toast("엑셀 파일을 읽지 못했습니다. .xlsx 또는 .csv 파일인지 확인해 주세요."); }
}
function xlsxBytes(aoa, name, widths){
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=widths.map(w=>({wch:w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, name);
  return new Uint8Array(XLSX.write(wb, {type:"array", bookType:"xlsx"}));
}
async function offerFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

let busy=false;
async function makePdf(){
  if (busy) return;
  const o = draftOrderObj();
  if (!o.items.some(it=>it.name)){ toast("자재를 한 건 이상 넣어 주세요"); return; }
  busy=true; const btn=document.querySelector('[data-act="pdf"]'); if(btn){ btn.disabled=true; btn.textContent="만드는 중…"; }
  try{
    if (document.fonts?.ready) await document.fonts.ready;
    const pages = paginate(o.items), host=$("#render-host");
    const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait"});
    for (let i=0;i<pages.length;i++){
      host.innerHTML = sheetHTML(o,pages[i],i+1,pages.length);
      const cv = await html2canvas(host.firstElementChild, {scale:2.5, backgroundColor:"#ffffff", useCORS:true, logging:false});
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",0.93),"JPEG",0,0,210,297);
    }
    host.innerHTML="";
    const d=(o.date||today()).slice(2).replace(/-/g,"");
    await offerFile(`${d}_발주서-${(o.vendor?.name||"거래처").replace(/[㈜()\s\\/:*?"<>|]/g,"")}.pdf`, pdf.output("blob"));
  }catch(e){ console.warn(e); toast("PDF를 만들지 못했습니다. 다시 시도해 주세요."); }
  busy=false; if(btn){ btn.disabled=false; btn.textContent="PDF 내려받기"; }
}

  captureVendorForm();
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const max=field==="stamp"?[240,240]:[360,140]; const r=Math.min(1,max[0]/img.width,max[1]/img.height); const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    S.vendorEdit={...(S.vendorEdit||{}), [field]:c.toDataURL("image/png")}; render(); toast("이미지를 넣었습니다. ‘"+(S.vendorEdit.id?"수정 내용 저장":"등록")+"’을 눌러야 저장됩니다."); };
  img.onerror=()=>toast("이미지를 읽지 못했습니다");
  img.src=url;
}

app.addEventListener("click", async e=>{
  const go=e.target.closest("[data-tab-go]"); if(go){ S.tab=go.dataset.tabGo; if(go.dataset.kind) S.vendorKind=go.dataset.kind; S.vendorEdit=null; render(); return; }
  const pick=e.target.closest("[data-pick]");
  if (pick){ const m=S.materials[+pick.dataset.pick]; S.draft.items.push({name:m.name||"",spec:m.spec||"",unit:m.unit||"",qty:"",price:m.price||"",note:m.note||""}); saveDraft(); S.search=""; $("#d-search").value=""; renderResults(); renderItems(); renderPreview(); const q=$("#it-q-"+(S.draft.items.length-1)); if(q) q.focus(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  const itRow=b.closest(".it"), ii=itRow?+itRow.dataset.i:-1, items=S.draft.items;
  switch(act){
    case "add-blank": items.push({name:"",spec:"",unit:"",qty:"",price:"",note:""}); saveDraft(); renderItems(); renderPreview(); $("#it-n-"+(items.length-1))?.focus(); break;
    case "it-del": items.splice(ii,1); saveDraft(); renderItems(); renderPreview(); break;
    case "it-up": if(ii>0){ [items[ii-1],items[ii]]=[items[ii],items[ii-1]]; saveDraft(); renderItems(); renderPreview(); } break;
    case "it-down": if(ii<items.length-1){ [items[ii+1],items[ii]]=[items[ii],items[ii+1]]; saveDraft(); renderItems(); renderPreview(); } break;
    case "new-order": S.draft=blankDraft(); saveDraft(); render(); toast("새 발주서를 시작했습니다"); break;
    case "save-order": {
      const o=draftOrderObj(); if(!o.site && !o.items.length){ toast("현장명이나 자재를 먼저 입력해 주세요"); break; }
      const oid=S.draft.id||("o"+uid());
      const doc={ site:o.site, date:o.date, vendorId:o.vendorId, vendor:o.vendor, due:o.due, payment:o.payment, special:o.special, place:o.place, placeManager:o.placeManager, inspect:o.inspect, vat:o.vat==="포함"?"포함":"별도", items:o.items.filter(it=>it.name||it.spec||it.qty), buyerId:o.buyerId, buyer:{...o.buyer, stamp:"", signature:""}, staffId:o.staffId||"", staff:o.staff?{...o.staff, signature:""}:null, savedAt:new Date().toISOString() };
      if (await dbSet("orders/"+oid, doc)){ S.draft.id=oid; saveDraft(); render(); toast("발주서를 저장했습니다"); }
      break; }
    case "pdf": makePdf(); break;
    case "print": { const o=draftOrderObj(); const pages=paginate(o.items); $("#print-host").innerHTML=pages.map((p,i)=>sheetHTML(o,p,i+1,pages.length)).join(""); if(document.fonts?.ready) await document.fonts.ready; window.print(); break; }
    case "retry": initDb(); break;
    case "logout": logout(); break;
    case "o-load": case "o-copy": { const o=S.orders.find(x=>x.id===id); if(!o) break; S.draft={ ...blankDraft(), ...o, items:(o.items||[]).map(x=>({...x})), id: act==="o-load"?o.id:null, date: act==="o-load"?o.date:today() }; delete S.draft.company; delete S.draft.savedAt; if(!S.draft.buyerId && buyers()[0]) applyBuyer(buyers()[0].id); saveDraft(); S.tab="order"; render(); toast(act==="o-load"?"발주서를 불러왔습니다":"복사본으로 새 발주서를 시작했습니다"); break; }
    case "o-del": S.confirm="o:"+id; render(); break;
    case "o-del-ok": S.confirm=null; if(await dbDel("orders/"+id)) toast("삭제했습니다"); if(S.draft.id===id){ S.draft.id=null; saveDraft(); } render(); break;
    case "v-edit": S.vendorEdit={...S.vendors.find(v=>v.id===id)}; S.vendorKind=S.vendorEdit.kind==="buyer"||S.vendorEdit.kind==="staff"?S.vendorEdit.kind:"supplier"; render(); window.scrollTo(0,0); break;
    case "v-cancel": S.vendorEdit=null; render(); break;
    case "v-use": { const v=S.vendors.find(x=>x.id===id); if(v?.kind==="buyer") applyBuyer(id); else if(v?.kind==="staff") applyStaff(id); else { S.draft.vendorId=id; S.draft.vendor=v||null; } saveDraft(); S.tab="order"; render(); break; }
    case "v-del": S.confirm="v:"+id; render(); break;
    case "v-del-ok": S.confirm=null; if(await dbDel("vendors/"+id)) toast("삭제했습니다"); render(); break;
    case "m-edit": S.matEdit=+b.dataset.i; render(); window.scrollTo(0,0); break;
    case "m-cancel": S.matEdit=null; render(); break;
    case "m-del": { const i=+b.dataset.i; S.materials=S.materials.filter((_,k)=>k!==i); if(S.matEdit===i) S.matEdit=null; saveMaterials(); render(); break; }
    case "m-clear": S.confirm="m:all"; render(); break;
    case "m-clear-ok": S.confirm=null; S.materials=[]; S.matEdit=null; saveMaterials(); render(); break;
    case "imp-cancel": S.pendingImport=null; render(); break;
    case "imp-replace": S.materials=S.pendingImport.rows; S.pendingImport=null; S.matEdit=null; saveMaterials(); render(); break;
    case "imp-merge": {
      const list=S.materials.slice(), key=m=>(m.name+"|"+(m.spec||"")).replace(/\s/g,"").toLowerCase(), pos=new Map(list.map((m,i)=>[key(m),i]));
      let add=0, upd=0; for(const r of S.pendingImport.rows){ const k=key(r); if(pos.has(k)){ list[pos.get(k)]=r; upd++; } else { pos.set(k,list.length); list.push(r); add++; } }
      S.materials=list; S.pendingImport=null; S.matEdit=null; saveMaterials(); render(); toast(`새 자재 ${add}건, 갱신 ${upd}건`); break; }
    case "tpl": await offerFile("자재등록_양식.xlsx", xlsxBytes([["품명","규격","단위","단가","비고"],["단자대","누전차단기1개내장형","SET","","가로등용접속함"]],"자재목록",[20,28,8,12,20])); break;
    case "mat-export": await offerFile(`자재목록_${today()}.xlsx`, xlsxBytes([["품명","규격","단위","단가","비고"], ...S.materials.map(m=>[m.name,m.spec,m.unit,m.price?Number(m.price):"",m.note])],"자재목록",[20,28,8,12,20])); break;
    case "img-clear": captureVendorForm(); S.vendorEdit={...S.vendorEdit, [b.dataset.f]:""}; render(); break;
    case "kind": S.vendorKind=b.dataset.kind; S.vendorEdit=null; S.confirm=null; render(); break;
  }
});

render();
initDb();
})();
</script>

</body>
