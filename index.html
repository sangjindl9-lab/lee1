<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장 사진대지</title>
<meta name="description" content="브라우저에서 바로 만드는 공사 사진대지. 양식 선택, 사진 드래그 앤 드롭, PDF·엑셀 내보내기.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: 좌측 작업 패널(양식·정보·사진) + 우측 A4 미리보기 스크롤. 종이는 항상 흰색, 작업대는 테마를 따름 */
:root{
  --bg:#e6e9e6; --panel:#f6f7f5; --ink:#1a2220; --muted:#5b6964; --line:#ccd3cf;
  --accent:#0e5a61; --accent-ink:#ffffff; --mark:#d27a22; --danger:#b3372f;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-doc:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-title:"Nanum Myeongjo","Batang",serif;
  --shadow:0 1px 2px rgba(20,30,28,.12),0 8px 24px rgba(20,30,28,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121817; --panel:#1b2321; --ink:#e4ebe8; --muted:#97a6a1; --line:#2d3936;
  --accent:#4cb0b2; --accent-ink:#0b1514; --mark:#e69a4a; --danger:#e0645b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --panel:#1b2321; --ink:#e4ebe8; --muted:#97a6a1; --line:#2d3936;
  --accent:#4cb0b2; --accent-ink:#0b1514; --mark:#e69a4a; --danger:#e0645b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}

/* 본문 */
.main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;display:flex;flex-direction:column;gap:22px}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec h3 em{font-style:normal;font-family:var(--f-mono);letter-spacing:0;color:var(--ink)}

.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{border:1px solid var(--line);border-radius:6px;padding:8px 6px 6px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.tpl:hover{border-color:var(--muted)}
.tpl.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl small{display:block;font-size:11px;line-height:1.25}
.tpl small i{display:block;font-style:normal;color:var(--muted);font-size:10px}
.mini{background:#fff;border:1px solid #b9c0bc;display:flex;flex-direction:column;padding:3px;gap:2px}
.mini.p{width:40px;height:56px}.mini.l{width:56px;height:40px}
.mini .t{height:3px;background:#555;width:50%;align-self:center}
.mini .g{flex:1;display:grid;gap:2px}
.mini .c{border:1px solid #777;display:flex;flex-direction:column;min-height:0}
.mini .c.sd{flex-direction:row}
.mini .ph{flex:1;background:#c9d6d7}
.mini .cp{height:2px;border-top:1px solid #777}
.mini .sc{width:35%;border-left:1px solid #777}

.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg)}
.inp:focus{border-color:var(--accent);outline:none}
.row2{display:flex;gap:6px;align-items:center}
.row2 .inp{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:6px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px;cursor:pointer}

.drop{border:1.5px dashed var(--muted);border-radius:8px;padding:18px 12px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--mark);color:var(--ink);background:color-mix(in srgb,var(--mark) 10%,transparent)}
.drop b{display:block;color:var(--ink);margin-bottom:2px}
.drop-btns{display:flex;gap:6px;margin-top:8px}
.drop-btns .btn{flex:1}

.selbox{border:1px solid var(--line);border-radius:8px;padding:10px}
.selhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.selthumb{width:64px;height:48px;border-radius:4px;background:#ccc center/cover no-repeat;flex:none}
.selhead div{min-width:0}
.selhead b{display:block;font-size:13px}
.selhead span{font-size:11px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0}

/* 미리보기 */
.stagebox{padding-block:20px 60px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.banner{max-width:820px;margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--mark);background:color-mix(in srgb,var(--mark) 12%,var(--panel));border-radius:8px;padding:9px 12px;font-size:13px}
.banner span{flex:1;min-width:200px}
.pages{display:flex;flex-direction:column;align-items:center;gap:26px}
.pg{display:flex;flex-direction:column;gap:6px}
.pgbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.pgbar .n{font-family:var(--f-mono)}
.wrap{position:relative;box-shadow:var(--shadow);background:#fff}
.wrap>.sheet{transform-origin:0 0;position:absolute;left:0;top:0}
.addpg{margin-top:4px}

/* 종이 (항상 흰색) */
.sheet{background:#fff;color:#111;font-family:var(--f-doc);display:flex;flex-direction:column;padding:44px 42px 28px;gap:12px;overflow:hidden}
.sh-title{text-align:center;font-family:var(--f-title);font-weight:800;font-size:30px;letter-spacing:.4em;text-indent:.4em;line-height:1.2}
.sh-info{display:grid;grid-template-columns:96px 1fr;border:1.5px solid #111;font-size:14px}
.sh-info>div{padding:7px 10px;display:flex;align-items:center;min-width:0}
.sh-info .lb{background:#f0f0ec;border-right:1px solid #111;justify-content:center;font-weight:700;letter-spacing:.3em;text-indent:.3em}
.sh-grid{flex:1;display:grid;gap:12px;min-height:0}
.cell{display:flex;flex-direction:column;border:1.5px solid #111;min-height:0;min-width:0;position:relative;background:#fff}
.cell.side{flex-direction:row}
.photo{flex:1;min-height:0;min-width:0;background-color:#fbfbfa;background-position:center;background-repeat:no-repeat;position:relative}
.cell.side .photo{flex:2;border-right:1px solid #111}
.caps{display:flex;flex-direction:column}
.cell.side .caps{flex:1;min-width:0}
.cap{display:grid;grid-template-columns:64px 1fr;border-top:1px solid #111;font-size:13px;height:29px}
.cell.side .cap{flex:1;height:auto;grid-template-columns:54px 1fr}
.cell.side .cap:first-child{border-top:0}
.cap .lb{background:#f0f0ec;border-right:1px solid #111;display:flex;align-items:center;justify-content:center;font-weight:700}
.cap .vl{display:flex;align-items:center;padding:0 8px;min-width:0;overflow:hidden;white-space:nowrap}
.cell.side .cap .vl{white-space:normal;line-height:1.35;padding:4px 8px}
.cap.line{grid-template-columns:1fr}
.cap.line .vl{justify-content:center}
.vl input{border:0;background:transparent;width:100%;padding:2px 0;font:inherit;color:inherit;text-align:inherit;outline:none;min-width:0}
.cap.line .vl input{text-align:center}
.vl input:focus{background:#fff4e3}
.badge{position:absolute;left:8px;top:8px;background:#111;color:#fff;font-size:12px;padding:3px 8px;font-weight:700;letter-spacing:.05em}
.sh-foot{display:flex;justify-content:space-between;font-size:12px;color:#333}

/* 미리보기 상호작용 (화면 전용) */
.ia .photo{cursor:pointer}
.ia .photo.empty::after{content:"사진을 끌어다 놓거나 클릭";position:absolute;inset:10px;border:1.5px dashed #b5bcb8;display:flex;align-items:center;justify-content:center;color:#8d9591;font-size:14px;text-align:center}
.ia .cell.over{outline:4px solid #d27a22;outline-offset:-2px}
.ia .cell.sel{outline:4px solid #0e5a61;outline-offset:2px}
.tools{position:absolute;right:8px;top:8px;display:none;gap:6px}
.ia .photo:hover .tools,.ia .cell.sel .tools{display:flex}
.tools button{width:34px;height:34px;border-radius:6px;border:0;background:rgba(17,17,17,.78);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tools button:hover{background:#111}
.tools svg{width:18px;height:18px}

/* 내보내기용 숨은 무대 */
.exstage{position:fixed;left:0;top:0;z-index:1}
.busy{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.busy b{font-size:16px}
.busy span{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.bar{width:240px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--panel);border-radius:10px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.modal h4{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .acts{justify-content:flex-end}

@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tpls{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:480px){.tpls{grid-template-columns:repeat(3,1fr)}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;padding:0}
  .top,.side,.banner,.pgbar,.addpg,.toast,.tools{display:none!important}
  .main{display:block}
  .stagebox{padding:0}
  .pages{gap:0;display:block}
  .wrap{width:auto!important;height:auto!important;box-shadow:none}
  .wrap>div{position:static!important;transform:none!important}
  .pg{break-after:page;page-break-after:always;gap:0}
  .ia .photo.empty::after{display:none}
  .ia .cell.sel{outline:0}
}
</style>
