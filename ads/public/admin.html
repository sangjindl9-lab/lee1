<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>이음 배너 광고 관리</title>
<style>
body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#f3f0fb;color:#1f1b33}
header{background:linear-gradient(135deg,#3b0fc4,#8a3cff);color:#fff;padding:14px 18px;font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e2dcf3;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:#6f6a85;margin:8px 0 4px}
input,select{width:100%;padding:9px;border:1px solid #e2dcf3;border-radius:8px;font:inherit;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;padding:9px 14px;border:0;border-radius:9px;background:#e9edf3;cursor:pointer;font-weight:600}
button.p{background:linear-gradient(135deg,#3b0fc4,#6a24ee);color:#fff}
button.d{background:#fde8e8;color:#c62828}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
img.th{width:120px;height:40px;object-fit:cover;border-radius:6px;background:#eee}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e3d6ff;color:#4c1ad6}.badge.off{background:#eee;color:#888}
.hint{font-size:12px;color:#6f6a85;line-height:1.6}
.apps{display:flex;gap:12px;flex-wrap:wrap;padding:6px 0}.apps label{display:flex;align-items:center;gap:4px;margin:0;font-size:14px;color:#1f1b33}.apps input{width:auto}
</style></head><body>
<header><span>이음 앱 통합 배너 광고 관리</span><button id="logout" hidden>로그아웃</button></header>
<main>
<div class="card" id="login"><label>관리자 비밀번호</label><input id="pw" type="password"><br><br><button class="p" id="loginBtn">로그인</button></div>
<div id="app" hidden>
<div class="card"><b>배너 등록 / 수정</b>
<form id="f">
<input type="hidden" name="id">
<div class="row"><div><label>제목(관리용)</label><input name="title"></div><div><label>링크 URL(누르면 이동)</label><input name="link" placeholder="https://"></div></div>
<div class="row"><div><label>자리</label><select name="slot"><optgroup label="이음뷰어 · 이음과 문서"><option value="top">홈 위쪽</option><option value="bottom">홈 아래쪽</option></optgroup><optgroup label="이음ZIP"><option value="home">홈 아래</option><option value="result">풀린 파일 화면 아래</option><option value="compress">압축하기 화면 아래</option></optgroup></select></div><div><label>순서(작을수록 먼저)</label><input name="order" type="number" value="0"></div></div>
<div class="row"><div><label>시작일(비우면 바로)</label><input name="start" type="date"></div><div><label>종료일(비우면 계속)</label><input name="end" type="date"></div></div>
<div class="row"><div><label>대상 앱</label><div class="apps"><label><input type="checkbox" name="app" value="eum-viewer" checked> 이음뷰어</label><label><input type="checkbox" name="app" value="eum-docs"> 이음과 문서</label><label><input type="checkbox" name="app" value="eum-zip"> 이음ZIP</label></div><input type="hidden" name="apps"></div><div><label>배경색(이미지 여백용, 예 #ffffff)</label><input name="bg" placeholder="#ffffff"></div></div>
<label>이미지 (권장 1200×300, PNG/JPG, 3MB 이하 — 가로 4:1 비율로 표시)</label><input name="image" type="file" accept="image/*">
<label><input type="checkbox" name="active" style="width:auto"> 바로 켜기</label>
<br><button class="p" type="submit">저장</button> <button type="button" id="reset">새로 입력</button>
</form></div>
<div class="card"><b>배너 목록</b><table id="list"></table></div>
<div class="card hint"><b>앱 쪽 동작</b><br>각 앱은 <code>/api/banners?app=eum-viewer</code> / <code>?app=eum-docs</code> / <code>?app=eum-zip</code> 을 받아 자리별 배너를 보여 줍니다(10분 캐시). 켜진 배너가 없으면 자리 자체가 숨겨집니다. 노출·클릭 수는 자동 집계됩니다.<br>
광고를 실제로 켜기 전에 Google Play 콘솔 → 앱 콘텐츠 → 광고 선언을 "예"로 바꿔야 합니다.</div>
</div>
</main>
<script>
const APPS={'eum-viewer':'이음뷰어','eum-docs':'이음과 문서','eum-zip':'이음ZIP'};const SLOTS={top:'홈 위',bottom:'홈 아래',home:'홈 아래',result:'풀린 파일',compress:'압축하기'};
const $=s=>document.querySelector(s);const api=(u,o={})=>fetch(u,{credentials:'same-origin',...o}).then(async r=>{if(r.status===401){show(false);throw new Error('로그인 필요')}return r.json()});
function show(on){$('#login').hidden=on;$('#app').hidden=!on;$('#logout').hidden=!on}
$('#loginBtn').onclick=async()=>{const r=await fetch('/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});if(!r.ok)return alert('비밀번호가 다릅니다');show(true);load()};
$('#logout').onclick=()=>{document.cookie='eumads=;max-age=0';show(false)};
$('#reset').onclick=()=>{$('#f').reset();$('#f').id.value=''};
$('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.set('active',e.target.active.checked);fd.set('apps',[...e.target.querySelectorAll('input[name=app]:checked')].map(x=>x.value).join(','));if(!fd.get('apps'))return alert('대상 앱을 하나 이상 고르세요');await api('/admin/api/banners',{method:'POST',body:fd});e.target.reset();e.target.id.value='';load()};
async function load(){const list=await api('/admin/api/banners');$('#list').innerHTML='<tr><th>이미지</th><th>제목</th><th>앱</th><th>자리</th><th>기간</th><th>노출/클릭</th><th>상태</th><th></th></tr>'+list.map(b=>`<tr><td>${b.image?`<img class="th" src="/img/${b.image}">`:''}</td><td>${b.title||''}<br><small>${b.link||''}</small></td><td>${(b.apps||['eum-viewer']).map(a=>APPS[a]||a).join('<br>')}</td><td>${SLOTS[b.slot]||b.slot} #${b.order||0}</td><td>${b.start||'-'} ~ ${b.end||'-'}</td><td>${b.stats?.imp||0} / ${b.stats?.click||0}</td><td><span class="badge ${b.active?'':'off'}">${b.active?'켜짐':'꺼짐'}</span></td><td><button data-t="${b.id}">${b.active?'끄기':'켜기'}</button> <button data-e="${b.id}">수정</button> <button class="d" data-d="${b.id}">삭제</button></td></tr>`).join('');
$('#list').onclick=async e=>{const t=e.target.dataset;if(t.t){await api('/admin/api/banners/'+t.t+'/toggle',{method:'POST'});load()}if(t.d&&confirm('삭제할까요?')){await api('/admin/api/banners/'+t.d,{method:'DELETE'});load()}if(t.e){const b=list.find(x=>x.id===t.e);const f=$('#f');for(const k of ['id','title','link','slot','order','start','end','bg'])f[k].value=b[k]??'';for(const c of f.querySelectorAll('input[name=app]'))c.checked=(b.apps||['eum-viewer']).includes(c.value);f.active.checked=!!b.active;window.scrollTo(0,0)}}}
api('/admin/api/banners').then(()=>{show(true);load()}).catch(()=>show(false));
</script></body></html>
