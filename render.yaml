services:
  - type: web
    name: meomul
    runtime: node
    region: singapore
    plan: free
    branch: meomul
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: meomul-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DEMO_LOGIN
        value: "true"
      - key: SEED_DEMO
        value: "true"
databases:
  - name: meomul-db
    region: singapore
    plan: free
