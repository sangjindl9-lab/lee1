name: EUM SMS GUARD APK 빌드
on:
  push:
    branches: [eum-sms-guard]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK 빌드
        run: gradle assembleDebug --no-daemon
      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk eum-sms-guard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eum-sms-guard-apk
          path: eum-sms-guard.apk
      - name: 다운로드 페이지(릴리스)에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete eum-sms-guard-latest --yes --cleanup-tag || true
          gh release create eum-sms-guard-latest eum-sms-guard.apk \
            --target "$GITHUB_SHA" \
            --title "EUM SMS GUARD 앱 (공부용)" \
            --notes "휴대폰에서 eum-sms-guard.apk를 눌러 내려받아 설치하세요. 설치 후 '알림 접근 권한 설정'에서 권한을 허용하고 '알림 감지 활성화'를 켜세요."
