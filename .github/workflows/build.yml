name: Build FileManager2 APK
on:
  push:
    branches: [filemanager2]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FileManager2-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to filemanager2-apk branch
        run: |
          mkdir /tmp/pub && cp app/build/outputs/apk/debug/app-debug.apk /tmp/pub/FileManager2.apk
          cd /tmp/pub
          git init -q -b filemanager2-apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add FileManager2.apk
          git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" filemanager2-apk
