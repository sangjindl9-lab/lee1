name: 이음챗 안드로이드 (네이티브 웹뷰)
on:
  push:
    branches: [eumchat]
    paths: ['android-native/**', '.github/workflows/eumchat-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: 빌드
        working-directory: android-native
        shell: bash
        run: |
          set -o pipefail
          gradle bundleRelease assembleRelease --no-daemon 2>&1 | tee ../build.log
      - name: 실패 로그 올리기
        if: failure()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          tail -c 60000 build.log > errors.txt || true
          gh release delete eumchat-native-log --yes --cleanup-tag || true
          gh release create eumchat-native-log errors.txt --target "$GITHUB_SHA" --prerelease --title "이음챗 네이티브 빌드 로그" --notes "빌드 실패 로그"
      - name: 릴리스에 올리기
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp android-native/app/build/outputs/bundle/release/app-release.aab eumchat-native-unsigned.aab
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk eumchat-native-unsigned.apk
          gh release delete eumchat-native-log --yes --cleanup-tag || true
          gh release delete eumchat-native --yes --cleanup-tag || true
          gh release create eumchat-native eumchat-native-unsigned.aab eumchat-native-unsigned.apk --target "$GITHUB_SHA" --title "이음챗 네이티브 (서명 전)" --notes "네이티브 웹뷰 앱, 서명 전"
