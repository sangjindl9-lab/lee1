name: Android APK
on:
  push:
    branches: [narabid]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk narabid.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 입찰정보 안드로이드 앱
          body: 휴대폰에서 narabid.apk 를 받아 설치하세요.
          files: narabid.apk
          make_latest: true
